name: Assistant Scottsdale Licensed Trade Census Export

on:
  push:
    paths:
      - '.github/workflows/assistant-scottsdale-census.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export complete Scottsdale licensed-trade census artifacts
        run: |
          python3 portfolio/automation/export-homversa-census-artifacts.py             --market Scottsdale             --date 2026-10-26             --output-dir portfolio/data

      - name: Validate deterministic census builder
        run: |
          python3 portfolio/automation/build-assistant-research-seed.py             --data-dir portfolio/data             --output /tmp/assistant-research-seed.sql             --summary-json 2>/tmp/census-summary.json
          cat /tmp/census-summary.json

      - name: Commit Scottsdale licensed-trade artifacts
        run: |
          git config user.name "BMC Assistant Census"
          git config user.email "actions@users.noreply.github.com"
          git add portfolio/data/assistant-research-bootstrap-2026-10-26-scottsdale-licensed-full-*.json
          if git diff --cached --quiet; then
            echo "No artifact changes."
            exit 0
          fi
          git commit -m "Seed full Scottsdale licensed trade census"
          git push origin HEAD:master
