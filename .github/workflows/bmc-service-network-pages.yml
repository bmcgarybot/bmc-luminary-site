name: BMC Service Network Pages

on:
  push:
    branches: ["master"]
    paths:
      - "portfolio/**"
      - ".github/workflows/bmc-service-network-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bmc-service-network-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage reviewed public website files
        run: python3 portfolio/automation/build-public-site.py "$RUNNER_TEMP/bmc-public-site"

      - name: Upload BMC Service Network site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/bmc-public-site

      - name: Deploy BMC Service Network
        id: deployment
        uses: actions/deploy-pages@v4
