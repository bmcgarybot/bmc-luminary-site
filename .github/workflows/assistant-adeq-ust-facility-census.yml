name: Assistant ADEQ Active UST Facility Census Export

on:
  push:
    paths:
      - 'portfolio/automation/export-adeq-ust-facility-census.py'
      - '.github/workflows/assistant-adeq-ust-facility-census.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export active ADEQ UST facilities for BMC markets
        run: |
          python3 portfolio/automation/export-adeq-ust-facility-census.py \
            --date 2026-10-26 \
            --output-dir portfolio/data

      - name: Validate deterministic census builder
        run: |
          python3 portfolio/automation/build-assistant-research-seed.py \
            --data-dir portfolio/data \
            --output /tmp/assistant-research-seed.sql \
            --summary-json 2>/tmp/census-summary.json
          cat /tmp/census-summary.json

      - name: Commit ADEQ UST government-registry artifact
        run: |
          git config user.name "BMC Assistant Census"
          git config user.email "actions@users.noreply.github.com"
          git add portfolio/data/assistant-research-bootstrap-2026-10-26-adeq-active-ust-facilities-31.json
          if git diff --cached --quiet; then
            echo "No ADEQ UST artifact changes."
            exit 0
          fi
          git commit -m "Seed ADEQ active UST commercial buyer census"
          git pull --rebase origin master
          git push origin HEAD:master
