name: Assistant Arizona School Census Export

on:
  push:
    paths:
      - 'portfolio/automation/export-ade-school-census.py'
      - '.github/workflows/assistant-ade-school-census.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install spreadsheet reader
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - name: Export FY2027 active school-site census artifacts
        run: |
          python3 portfolio/automation/export-ade-school-census.py             --date 2026-10-26             --output-dir portfolio/data

      - name: Validate deterministic census builder
        run: |
          python3 portfolio/automation/build-assistant-research-seed.py             --data-dir portfolio/data             --output /tmp/assistant-research-seed.sql             --summary-json 2>/tmp/census-summary.json
          cat /tmp/census-summary.json

      - name: Commit ADE school artifacts
        run: |
          git config user.name "BMC Assistant Census"
          git config user.email "actions@users.noreply.github.com"
          git add portfolio/data/assistant-research-bootstrap-2026-10-26-ade-schools-*-08.json
          if git diff --cached --quiet; then
            echo "No artifact changes."
            exit 0
          fi
          git commit -m "Seed official Arizona school buyer census"
          git push origin HEAD:master
