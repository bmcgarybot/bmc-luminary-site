name: BMC Portfolio CI

on:
  push:
    paths:
      - "portfolio/**"
      - ".github/workflows/bmc-portfolio-ci.yml"
  pull_request:
    paths:
      - "portfolio/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate API syntax
        run: python -m py_compile portfolio/automation/api/app.py
      - name: Validate service registry and fronts
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path("portfolio")
          data=json.loads((root/"data/services.json").read_text())
          services=data["services"]
          assert len(services) >= 54, f"Expected >=54 services, got {len(services)}"
          missing=[]
          dup=set(); seen=set()
          for s in services:
              key=s["service_key"]
              if key in seen: dup.add(key)
              seen.add(key)
              front=s.get("live_front","")
              if front.startswith("/portfolio/"):
                  rel=front[len("/portfolio/"):].strip("/")
                  if not (root/rel/"index.html").exists(): missing.append((key,front))
          assert not dup, f"Duplicate service keys: {sorted(dup)}"
          assert not missing, f"Missing service fronts: {missing}"
          print(f"Validated {len(services)} registered services")
          import re
          allowed=set(s["service_key"] for s in services) | {"universal_request","vendor_partner","vendor_pilot_activation","vendor_response","job_update","facility_maintenance"}
          invalid=[]
          forms=0
          for html in root.rglob("*.html"):
              text=html.read_text(errors="ignore")
              for form_type in re.findall(r'data-form-type="([^"]+)"',text):
                  forms+=1
                  if form_type not in allowed:
                      invalid.append((str(html),form_type))
          assert not invalid, f"Invalid form types: {invalid}"
          print(f"Validated {forms} form endpoints")
          required=[
              root/"solutions/index.html",
              root/"provider-login/index.html",
              root/"provider-dashboard/index.html",
              root/"providers/index.html",
              root/"services/index.html",
          ]
          missing_required=[str(p) for p in required if not p.exists()]
          assert not missing_required, f"Missing required public surfaces: {missing_required}"
          print("Validated provider portal and solution hub surfaces")
          PY
      - name: Validate generated priority storefronts
        run: python portfolio/automation/generate-storefronts.py --check

      - name: Reject legacy public UI
        run: python portfolio/automation/validate-public-ui.py

      - name: Reject internal language in public copy
        run: python portfolio/automation/validate-public-copy.py

      - name: Validate public form contracts
        run: python portfolio/automation/validate-form-contracts.py

      - name: Validate search and download readiness
        run: python portfolio/automation/validate-search-readiness.py

      - name: Validate Compose
        working-directory: portfolio/automation
        run: docker compose --env-file .env.example config >/dev/null

      - name: Validate operational scripts
        working-directory: portfolio/automation
        run: |
          bash -n provision-cloud.sh bootstrap.sh start.sh stop.sh backup.sh runtime-doctor.sh deploy-update.sh \
            configure-cloudflare.sh verify-public-ingress.sh verify-backup.sh install-backup-timer.sh \
            expand-source-native-markets.sh configure-stripe-webhook.sh drain-research-backlog.sh launch-readiness.sh \
            stage-outreach-wave.sh
          sh -n scheduler.sh

      - name: Validate public gateway configuration
        working-directory: portfolio/automation
        run: |
          docker run --rm \
            --add-host ops_api:127.0.0.1 \
            --add-host n8n:127.0.0.1 \
            -v "$PWD/nginx-webhooks.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: Boot database and API smoke test
        working-directory: portfolio/automation
        run: |
          cp .env.example .env.ci
          sed -i 's/^SMTP_DRY_RUN=.*/SMTP_DRY_RUN=true/' .env.ci
          sed -i 's#^STRIPE_WEBHOOK_SECRET=.*#STRIPE_WEBHOOK_SECRET=whsec_ci_test#' .env.ci
          sed -i 's#^BMC_ADMIN_KEY=.*#BMC_ADMIN_KEY=ci_admin_key#' .env.ci
          sed -i 's#^RESEARCH_SEARCH_URL=.*#RESEARCH_SEARCH_URL=http://research-mock:8080/search#' .env.ci
          sed -i 's#^SOURCE_NATIVE_MARKETS=.*#SOURCE_NATIVE_MARKETS=Prescott#' .env.ci
          sed -i 's#^SOURCE_NATIVE_CHECK_BATCH=.*#SOURCE_NATIVE_CHECK_BATCH=5#' .env.ci
          sed -i 's#^ADHS_FACILITIES_URL=.*#ADHS_FACILITIES_URL=http://research-mock:8080/adhs#' .env.ci
          sed -i 's#^ADHS_SOURCE_NATIVE_PAGE_SIZE=.*#ADHS_SOURCE_NATIVE_PAGE_SIZE=10#' .env.ci
          sed -i 's#^CMS_SOURCE_NATIVE_ENABLED=.*#CMS_SOURCE_NATIVE_ENABLED=true#' .env.ci
          sed -i 's#^CMS_SOURCE_NATIVE_PAGE_SIZE=.*#CMS_SOURCE_NATIVE_PAGE_SIZE=10#' .env.ci
          sed -i 's#^CMS_HOSPITALS_URL=.*#CMS_HOSPITALS_URL=http://research-mock:8080/cms-hospitals#' .env.ci
          sed -i 's#^CMS_NURSING_HOMES_URL=.*#CMS_NURSING_HOMES_URL=http://research-mock:8080/cms-nursing#' .env.ci
          sed -i 's#^CMS_HOME_HEALTH_URL=.*#CMS_HOME_HEALTH_URL=http://research-mock:8080/cms-home-health#' .env.ci
          sed -i 's#^CMS_HOSPICE_URL=.*#CMS_HOSPICE_URL=http://research-mock:8080/cms-hospice#' .env.ci
          docker compose --env-file .env.ci up -d postgres

          # Production bootstrap owns schema/seed application. CI must mirror that
          # behavior rather than depending on docker-entrypoint-initdb.d.
          for i in $(seq 1 60); do
            logs="$(docker compose --env-file .env.ci logs --no-color postgres 2>&1 || true)"
            if printf '%s' "$logs" | grep -Eq 'PostgreSQL init process complete; ready for start up|Skipping initialization'; then
              break
            fi
            sleep 1
          done
          ready=0
          for i in $(seq 1 60); do
            if docker compose --env-file .env.ci exec -T postgres pg_isready -U bmc_automation -d bmc_portfolio >/dev/null 2>&1; then
              ready=$((ready+1))
              if [ "$ready" -ge 3 ]; then break; fi
            else
              ready=0
            fi
            sleep 1
          done
          test "$ready" -ge 3

          for file in schema.sql seed-services.sql seed-vendors.sql seed-buyers.sql seed-outreach.sql seed-buyer-outreach.sql seed-growth-pack-sales.sql seed-first-wave.sql seed-products.sql seed-research.sql seed-research-sources.sql seed-research-scale.sql; do
            docker compose --env-file .env.ci exec -T postgres psql -v ON_ERROR_STOP=1 -U bmc_automation -d bmc_portfolio < "$file"
          done

          docker compose --env-file .env.ci up -d --build ops_api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/bmc_health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/bmc_health.json
          POSTGRES_CONTAINER="$(docker compose --env-file .env.ci ps -q postgres)"
          BMC_NETWORK="$(docker inspect "$POSTGRES_CONTAINER" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')"
          docker run -d --rm --name research-mock --network "$BMC_NETWORK" -v "$PWD/ci:/srv:ro" python:3.12-alpine python -m http.server 8080 --directory /srv
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc 'select count(*) from research_sources where is_active=true;')" -ge 12
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc 'select count(*) from services;')" -ge 54
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from services where service_key='auto_repair_shop' and is_active=true;")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc 'select count(*) from vendors;')" -ge 111
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc 'select count(*) from buyers;')" -ge 140
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from research_backlog where status='queued';")" -ge 600

          # Regression: routine scale/migration reruns must never resurrect terminal research.
          docker compose --env-file .env.ci exec -T postgres psql -v ON_ERROR_STOP=1 -U bmc_automation -d bmc_portfolio -c "
            insert into research_backlog(
              market,service_key,side,market_priority,target_gap,current_count,goal,
              research_priority,research_method,status,research_pass,candidates_found,notes
            ) values
              ('CI Migration Terminal Completed','commercial_cleaning','vendor','TIER2',10,0,10,'MEDIUM','ci','completed',1,0,'CI terminal-state migration guard'),
              ('CI Migration Terminal Review','commercial_cleaning','vendor','TIER2',10,0,10,'MEDIUM','ci','review',1,0,'CI terminal-state migration guard'),
              ('CI Migration Terminal NoResult','commercial_cleaning','vendor','TIER2',10,0,10,'MEDIUM','ci','searched_no_results',1,0,'CI terminal-state migration guard');"
          docker compose --env-file .env.ci exec -T postgres psql -v ON_ERROR_STOP=1 -U bmc_automation -d bmc_portfolio < seed-research-scale.sql
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "
            select count(*) from research_backlog
            where (market,status) in (
              ('CI Migration Terminal Completed','completed'),
              ('CI Migration Terminal Review','review'),
              ('CI Migration Terminal NoResult','searched_no_results')
            );")" -eq 3
          docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -c "
            delete from research_backlog where market like 'CI Migration Terminal %';"

          # Controlled wave staging must queue only selected research prospects and never send.
          docker compose --env-file .env.ci exec -T postgres psql -v ON_ERROR_STOP=1 -U bmc_automation -d bmc_portfolio -c "
            insert into vendors(vendor_id,business_name,public_email,public_phone,website,source_url,status,quality_score)
            values('v_ci_stage','CI Stage Vendor','ci-stage@example.com','9285550199','https://example.com/','https://example.com/','prospect',100);
            insert into vendor_markets(vendor_id,market) values('v_ci_stage','CI Stage Market');
            insert into vendor_services(vendor_id,service_key) values('v_ci_stage','commercial_cleaning');"
          bash ./stage-outreach-wave.sh .env.ci vendor ci_launch 1 "CI Stage Market" commercial_cleaning preview >/tmp/bmc_stage_preview.txt
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where wave='ci_launch';")" -eq 0
          bash ./stage-outreach-wave.sh .env.ci vendor ci_launch 1 "CI Stage Market" commercial_cleaning --apply >/tmp/bmc_stage_apply.txt
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='vendor' and entity_id='v_ci_stage' and campaign='vendor_recruitment' and wave='ci_launch' and status='queued' and sent_at is null and target_market='CI Stage Market' and target_service_key='commercial_cleaning';")" -eq 1
          curl -fsS 'http://127.0.0.1:8000/api/admin/outreach-wave-preview?side=vendor&wave=ci_launch&limit=10' \
            -H 'X-BMC-Admin-Key: ci_admin_key' >/tmp/bmc_wave_preview.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_wave_preview.json"))
          assert data["ok"] is True
          assert data["sending_enabled"] is False
          assert data["count"] == 1
          row=data["records"][0]
          assert row["entity_id"] == "v_ci_stage"
          assert row["market"] == "CI Stage Market"
          assert row["service_key"] == "commercial_cleaning"
          assert "/provider-pilot-activate/?" in row["body"]
          assert "vendor_id=v_ci_stage" in row["body"]
          PY
          docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -c "
            delete from outreach where entity_type='vendor' and entity_id='v_ci_stage';
            delete from vendor_services where vendor_id='v_ci_stage';
            delete from vendor_markets where vendor_id='v_ci_stage';
            delete from vendors where vendor_id='v_ci_stage';"
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from information_schema.tables where table_name='public_opportunities';")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from information_schema.tables where table_name='local_demand_signals';")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from information_schema.tables where table_name='source_native_state';")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='vendor' and wave='pilot1';")" -eq 12
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='buyer' and wave='pilot1';")" -eq 7
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='buyer' and campaign='growth_pack_sales' and wave='growth1';")" -ge 1
          bash runtime-doctor.sh .env.ci

          # Prove First Wave provider copy uses the dedicated existing-vendor activation path.
          export BMC_ADMIN_KEY="$(grep '^BMC_ADMIN_KEY=' .env.ci | cut -d= -f2-)"

          # Exact real-world search regressions from manual QA.
          curl -fsS -X POST http://127.0.0.1:8000/api/service-search \
            -H 'Content-Type: application/json' \
            -d '{"query":"fix my fryer"}' >/tmp/bmc_search_fryer.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_search_fryer.json"))
          assert data["ok"] is True
          assert data["match"]["service_key"] == "restaurant_equipment", data
          PY

          curl -fsS -X POST http://127.0.0.1:8000/api/service-search \
            -H 'Content-Type: application/json' \
            -d '{"query":"brake repair"}' >/tmp/bmc_search_auto_repair.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_search_auto_repair.json"))
          assert data["ok"] is True
          assert data["match"]["service_key"] == "auto_repair_shop", data
          PY

          curl -fsS -X POST http://127.0.0.1:8000/api/service-search \
            -H 'Content-Type: application/json' \
            -d '{"query":"real estate"}' >/tmp/bmc_search_real_estate.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_search_real_estate.json"))
          assert data["ok"] is True
          assert data["match"]["service_key"] == "realtor_listing_prep", data
          assert any(x["service_key"]=="home_staging" for x in data["related"])
          PY

          curl -fsS http://127.0.0.1:8000/api/admin/provider-funnel \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_provider_funnel.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_provider_funnel.json"))
          assert data["ok"] is True
          assert "stages" in data and "rates" in data
          assert "approved" in data["stages"]
          PY

          curl -fsS http://127.0.0.1:8000/api/admin/launch-cell \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_launch_cell.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_launch_cell.json"))
          assert data["ok"] is True
          assert len(data["records"]) == 10
          assert data["green"] + data["yellow"] + data["red"] == 10
          PY

          curl -fsS -X POST http://127.0.0.1:8000/api/admin/queue-launch-gaps \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_launch_gaps.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_launch_gaps.json"))
          assert data["ok"] is True
          assert data["queued_count"] >= 0
          PY

          # Public procurement and indexed local-demand monitors must be read-only and callable.
          curl -fsS -X POST http://127.0.0.1:8000/api/process-public-opportunities \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_public_opportunities.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_public_opportunities.json"))
          assert data["ok"] is True
          assert data["enabled"] is True
          assert data["sources_checked"] == 17, data
          assert data["expired_opportunities"] >= 0, data
          assert data["errors"] == [], data
          PY

          curl -fsS -X POST http://127.0.0.1:8000/api/process-local-demand-signals \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_local_signals.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_local_signals.json"))
          assert data["ok"] is True
          assert data["enabled"] is True
          assert data["searches"] == 24, data
          assert data["expired_signals"] >= 0, data
          assert data["errors"] == [], data
          PY

          curl -fsS http://127.0.0.1:8000/api/admin/daily-brief \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_daily_brief.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_daily_brief.json"))
          assert data["ok"] is True
          for key in ("open_exceptions","provider_approvals","service_change_reviews","human_operator_tasks","public_opportunities","public_opportunities_actionable","public_opportunities_discovered","local_demand_signals","local_demand_signals_useful","local_demand_signals_discovered","research_candidates_waiting","source_native_markets_tracked","source_native_stale_markets"):
              assert key in data["counts"], (key,data)
          assert "source_native_issues" in data, data
          assert isinstance(data["needs_brett"], bool), data
          assert isinstance(data["review_ready"], bool), data
          assert data["headline"] in (
              "There are decisions or exceptions that need you.",
              "New research is ready for a quick review.",
              "Nothing urgent needs you."
          ), data
          assert "public_opportunities" in data
          assert "local_demand_signals" in data
          PY

          curl -fsS -X POST http://127.0.0.1:8000/api/process-growth-outreach \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_growth_outreach_disabled.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_growth_outreach_disabled.json"))
          assert data["ok"] is True
          assert data["enabled"] is False
          assert data["sent"] == 0
          PY

          # Prove the bounded operator performs internal work while external actions remain impossible.
          curl -fsS -X POST http://127.0.0.1:8000/api/agent-cycle \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_agent_cycle.json
          cat /tmp/bmc_agent_cycle.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_agent_cycle.json"))
          assert data["ok"] is True
          assert data["enabled"] is True
          assert data["external_actions_performed"] == 0
          assert data["external_actions_allowed"] is False
          assert data["research_tasks_created"] == 5
          PY
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from agent_runs where status='completed';") -ge 1
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from tasks where owner='research_agent' and status='open';") -eq 5
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where sent_at is not null;") -eq 0

          # A second operator cycle must respect the five-task research concurrency cap.
          curl -fsS -X POST http://127.0.0.1:8000/api/agent-cycle \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_agent_cycle_2.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_agent_cycle_2.json"))
          assert data["research_tasks_created"] == 0
          assert data["external_actions_performed"] == 0
          PY
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from tasks where owner='research_agent' and status='open';") -eq 5

          # Prove the research worker converts deterministic search results into review-only candidates.
          curl -fsS -X POST http://127.0.0.1:8000/api/process-research \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_research.json
          cat /tmp/bmc_research.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_research.json"))
          assert data["ok"] is True
          assert data["enabled"] is True
          assert data["processed"] == 1
          assert data["staged"] == 4
          assert data["auto_promoted"] == 2
          assert data["errors"] == []
          PY
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from research_candidates where status='discovered';") -eq 2
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from research_candidates where status='discovered' and coalesce(evidence->>'public_email','')<>'' and coalesce(evidence->>'public_phone','')<>'';") -eq 2
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from research_candidates where status='promoted' and evidence->>'promotion_reason'='direct_domain_public_email';") -eq 2
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(distinct evidence->'promoted_entity'->>'entity_id') from research_candidates where status='promoted' and evidence->>'promotion_reason'='direct_domain_public_email';") -eq 1
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from vendors where lower(public_email)='research@example.com' and status='prospect' and coalesce(public_phone,'')<>'';") -eq 1
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_id=(select vendor_id from vendors where lower(public_email)='research@example.com' limit 1);") -eq 0
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from tasks where owner='research_agent' and status='open';") -eq 4
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from research_backlog where research_pass=1;") -ge 1
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from research_backlog where research_pass=1 and status='queued';") -ge 1
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from research_backlog where research_pass=1 and target_gap=greatest(0,goal-current_count);") -ge 1

          # A completed research pass with a remaining gap must be eligible for the next bounded pass.
          curl -fsS -X POST http://127.0.0.1:8000/api/agent-cycle \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_agent_cycle_refill.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_agent_cycle_refill.json"))
          assert data["ok"] is True
          assert data["research_tasks_created"] == 1, data
          assert data["external_actions_performed"] == 0
          PY
