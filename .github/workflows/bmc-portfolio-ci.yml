name: BMC Portfolio CI

on:
  push:
    paths:
      - "portfolio/**"
      - ".github/workflows/bmc-portfolio-ci.yml"
  pull_request:
    paths:
      - "portfolio/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate API syntax
        run: python -m py_compile portfolio/automation/api/app.py
      - name: Validate service registry and fronts
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path("portfolio")
          data=json.loads((root/"data/services.json").read_text())
          services=data["services"]
          assert len(services) >= 48, f"Expected >=48 services, got {len(services)}"
          missing=[]
          dup=set(); seen=set()
          for s in services:
              key=s["service_key"]
              if key in seen: dup.add(key)
              seen.add(key)
              front=s.get("live_front","")
              if front.startswith("/portfolio/"):
                  rel=front[len("/portfolio/"):].strip("/")
                  if not (root/rel/"index.html").exists(): missing.append((key,front))
          assert not dup, f"Duplicate service keys: {sorted(dup)}"
          assert not missing, f"Missing service fronts: {missing}"
          print(f"Validated {len(services)} registered services")
          import re
          allowed=set(s["service_key"] for s in services) | {"universal_request","vendor_partner","vendor_pilot_activation","vendor_response","job_update","facility_maintenance"}
          invalid=[]
          forms=0
          for html in root.rglob("*.html"):
              text=html.read_text(errors="ignore")
              for form_type in re.findall(r'data-form-type="([^"]+)"',text):
                  forms+=1
                  if form_type not in allowed:
                      invalid.append((str(html),form_type))
          assert not invalid, f"Invalid form types: {invalid}"
          print(f"Validated {forms} form endpoints")
          required=[
              root/"solutions/index.html",
              root/"provider-login/index.html",
              root/"provider-dashboard/index.html",
              root/"providers/index.html",
              root/"services/index.html",
          ]
          missing_required=[str(p) for p in required if not p.exists()]
          assert not missing_required, f"Missing required public surfaces: {missing_required}"
          print("Validated provider portal and solution hub surfaces")
          PY
      - name: Validate generated priority storefronts
        run: python portfolio/automation/generate-storefronts.py --check

      - name: Reject legacy public UI
        run: python portfolio/automation/validate-public-ui.py

      - name: Reject internal language in public copy
        run: python portfolio/automation/validate-public-copy.py

      - name: Validate Compose
        working-directory: portfolio/automation
        run: docker compose --env-file .env.example config >/dev/null

      - name: Validate operational scripts
        working-directory: portfolio/automation
        run: |
          bash -n provision-cloud.sh bootstrap.sh start.sh stop.sh backup.sh runtime-doctor.sh \
            configure-cloudflare.sh verify-public-ingress.sh verify-backup.sh install-backup-timer.sh

      - name: Validate public gateway configuration
        working-directory: portfolio/automation
        run: |
          docker run --rm \
            --add-host ops_api:127.0.0.1 \
            --add-host n8n:127.0.0.1 \
            -v "$PWD/nginx-webhooks.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: Boot database and API smoke test
        working-directory: portfolio/automation
        run: |
          cp .env.example .env.ci
          sed -i 's/^SMTP_DRY_RUN=.*/SMTP_DRY_RUN=true/' .env.ci
          sed -i 's#^STRIPE_WEBHOOK_SECRET=.*#STRIPE_WEBHOOK_SECRET=whsec_ci_test#' .env.ci
          sed -i 's#^BMC_ADMIN_KEY=.*#BMC_ADMIN_KEY=ci_admin_key#' .env.ci
          sed -i 's#^RESEARCH_SEARCH_URL=.*#RESEARCH_SEARCH_URL=http://research-mock:8080/search#' .env.ci
          docker compose --env-file .env.ci up -d postgres

          # Production bootstrap owns schema/seed application. CI must mirror that
          # behavior rather than depending on docker-entrypoint-initdb.d.
          for i in $(seq 1 60); do
            logs="$(docker compose --env-file .env.ci logs --no-color postgres 2>&1 || true)"
            if printf '%s' "$logs" | grep -Eq 'PostgreSQL init process complete; ready for start up|Skipping initialization'; then
              break
            fi
            sleep 1
          done
          ready=0
          for i in $(seq 1 60); do
            if docker compose --env-file .env.ci exec -T postgres pg_isready -U bmc_automation -d bmc_portfolio >/dev/null 2>&1; then
              ready=$((ready+1))
              if [ "$ready" -ge 3 ]; then break; fi
            else
              ready=0
            fi
            sleep 1
          done
          test "$ready" -ge 3

          for file in schema.sql seed-services.sql seed-vendors.sql seed-buyers.sql seed-outreach.sql seed-buyer-outreach.sql seed-growth-pack-sales.sql seed-first-wave.sql seed-products.sql seed-research.sql; do
            docker compose --env-file .env.ci exec -T postgres psql -v ON_ERROR_STOP=1 -U bmc_automation -d bmc_portfolio < "$file"
          done

          docker compose --env-file .env.ci up -d --build ops_api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/bmc_health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/bmc_health.json
          POSTGRES_CONTAINER="$(docker compose --env-file .env.ci ps -q postgres)"
          BMC_NETWORK="$(docker inspect "$POSTGRES_CONTAINER" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')"
          docker run -d --rm --name research-mock --network "$BMC_NETWORK" -v "$PWD/ci:/srv:ro" python:3.12-alpine python -m http.server 8080 --directory /srv
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc 'select count(*) from services;')" -ge 48
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc 'select count(*) from vendors;')" -ge 111
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc 'select count(*) from buyers;')" -ge 140
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from research_backlog where status='queued';")" -ge 600
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='vendor' and wave='pilot1';")" -eq 12
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='buyer' and wave='pilot1';")" -eq 7
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='buyer' and campaign='growth_pack_sales' and wave='growth1';")" -ge 1
          bash runtime-doctor.sh .env.ci

          # Prove First Wave provider copy uses the dedicated existing-vendor activation path.
          export BMC_ADMIN_KEY="$(grep '^BMC_ADMIN_KEY=' .env.ci | cut -d= -f2-)"

          # Exact real-world search regressions from manual QA.
          curl -fsS -X POST http://127.0.0.1:8000/api/service-search \
            -H 'Content-Type: application/json' \
            -d '{"query":"fix my fryer"}' >/tmp/bmc_search_fryer.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_search_fryer.json"))
          assert data["ok"] is True
          assert data["match"]["service_key"] == "restaurant_equipment", data
          PY

          curl -fsS -X POST http://127.0.0.1:8000/api/service-search \
            -H 'Content-Type: application/json' \
            -d '{"query":"real estate"}' >/tmp/bmc_search_real_estate.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_search_real_estate.json"))
          assert data["ok"] is True
          assert data["match"]["service_key"] == "realtor_listing_prep", data
          assert any(x["service_key"]=="home_staging" for x in data["related"])
          PY

          curl -fsS http://127.0.0.1:8000/api/admin/provider-funnel \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_provider_funnel.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_provider_funnel.json"))
          assert data["ok"] is True
          assert "stages" in data and "rates" in data
          assert "approved" in data["stages"]
          PY

          curl -fsS http://127.0.0.1:8000/api/admin/launch-cell \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_launch_cell.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_launch_cell.json"))
          assert data["ok"] is True
          assert len(data["records"]) == 10
          assert data["green"] + data["yellow"] + data["red"] == 10
          PY

          curl -fsS -X POST http://127.0.0.1:8000/api/admin/queue-launch-gaps \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_launch_gaps.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_launch_gaps.json"))
          assert data["ok"] is True
          assert data["queued_count"] >= 0
          PY

          curl -fsS -X POST http://127.0.0.1:8000/api/process-growth-outreach \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_growth_outreach_disabled.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_growth_outreach_disabled.json"))
          assert data["ok"] is True
          assert data["enabled"] is False
          assert data["sent"] == 0
          PY

          # Prove the bounded operator performs internal work while external actions remain impossible.
          curl -fsS -X POST http://127.0.0.1:8000/api/agent-cycle \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_agent_cycle.json
          cat /tmp/bmc_agent_cycle.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_agent_cycle.json"))
          assert data["ok"] is True
          assert data["enabled"] is True
          assert data["external_actions_performed"] == 0
          assert data["external_actions_allowed"] is False
          assert data["research_tasks_created"] == 5
          PY
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from agent_runs where status='completed';") -ge 1
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from tasks where owner='research_agent' and status='open';") -eq 5
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where sent_at is not null;") -eq 0

          # A second operator cycle must respect the five-task research concurrency cap.
          curl -fsS -X POST http://127.0.0.1:8000/api/agent-cycle \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_agent_cycle_2.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_agent_cycle_2.json"))
          assert data["research_tasks_created"] == 0
          assert data["external_actions_performed"] == 0
          PY
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from tasks where owner='research_agent' and status='open';") -eq 5

          # Prove the research worker converts deterministic search results into review-only candidates.
          curl -fsS -X POST http://127.0.0.1:8000/api/process-research \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_research.json
          cat /tmp/bmc_research.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_research.json"))
          assert data["ok"] is True
          assert data["enabled"] is True
          assert data["processed"] == 1
          assert data["staged"] == 2
          assert data["errors"] == []
          PY
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from research_candidates where status='discovered';") -eq 2
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from tasks where owner='research_agent' and status='open';") -eq 4

          curl -fsS 'http://127.0.0.1:8000/api/admin/research-candidates?status=discovered&limit=10' \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_research_candidates.json
          export RESEARCH_CANDIDATE_ID="$(python -c 'import json; d=json.load(open("/tmp/bmc_research_candidates.json")); assert d["count"]==2; print(d["records"][0]["candidate_id"])')"
          python - <<'PY' >/tmp/bmc_candidate_review.json
          import json, os
          print(json.dumps({"candidate_id":os.environ["RESEARCH_CANDIDATE_ID"],"status":"reviewed"}))
          PY
          curl -fsS -X POST http://127.0.0.1:8000/api/admin/research-candidate-status \
            -H 'Content-Type: application/json' -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" \
            --data-binary @/tmp/bmc_candidate_review.json >/tmp/bmc_candidate_review_result.json
          test $(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from research_candidates where status='reviewed';") -eq 1

          curl -fsS http://127.0.0.1:8000/api/admin/agent-status \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_agent_status.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_agent_status.json"))
          assert data["mode"] == "bounded_internal_operator_v1"
          assert data["external_actions_allowed"] is False
          assert data["last_run"]["status"] == "completed"
          PY

          curl -fsS http://127.0.0.1:8000/api/admin/first-wave \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_first_wave.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_first_wave.json"))
          assert data["count"] == 19
          provider=next(x for x in data["records"] if x["side"]=="vendor")
          assert "/provider-pilot-activate/?" in provider["activation_url"]
          assert "/provider-pilot-activate/?" in provider["body"]
          assert "/vendor-partner/" not in provider["body"]
          PY

          # Prove a First Wave provider can submit against its existing record, stays unroutable,
          # appears in the private review queue, and only becomes pilot after BMC approval.
          curl -fsS -X POST http://127.0.0.1:8000/api/intake \
            -H 'Content-Type: application/json' \
            -d '{"form_type":"vendor_pilot_activation","vendor_id":"v_prescott_zebrascapes","email":"info@zebrascapes.com","territory":"Prescott and surrounding Yavapai County","minimum_job":"500","capacity":"3 new jobs per week","credentials":"CI credential review","insurance":"CI insurance review","pilot_terms":"accepted"}' \
            >/tmp/bmc_pilot_activation.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_pilot_activation.json"))
          assert data["ok"] is True
          assert data["status"] == "pilot_pending_review"
          PY
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select status from vendors where vendor_id='v_prescott_zebrascapes';")" = "pilot_pending_review"

          # Bootstrap/seed reruns must never erase a live provider activation submission.
          docker compose --env-file .env.ci exec -T postgres psql -v ON_ERROR_STOP=1 -U bmc_automation -d bmc_portfolio < seed-vendors.sql
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select status from vendors where vendor_id='v_prescott_zebrascapes';")" = "pilot_pending_review"
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select capacity from vendors where vendor_id='v_prescott_zebrascapes';")" = "3 new jobs per week"
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select insurance_notes from vendors where vendor_id='v_prescott_zebrascapes';")" = "CI insurance review"

          curl -fsS http://127.0.0.1:8000/api/admin/pilot-reviews \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_pilot_reviews.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_pilot_reviews.json"))
          row=next(x for x in data["records"] if x["vendor_id"]=="v_prescott_zebrascapes")
          assert row["territory_notes"]
          assert row["capacity"]
          PY
          curl -fsS -X POST http://127.0.0.1:8000/api/admin/approve-pilot \
            -H 'Content-Type: application/json' \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" \
            -d '{"vendor_id":"v_prescott_zebrascapes","confirm_credentials":true,"notes":"CI approval"}' \
            >/tmp/bmc_pilot_approve.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_pilot_approve.json"))
          assert data["ok"] is True
          assert data["status"] == "pilot"
          PY
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select status from vendors where vendor_id='v_prescott_zebrascapes';")" = "pilot"
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from exceptions where vendor_id='v_prescott_zebrascapes' and type='pilot_activation_review' and status='open';")" -eq 0

          # Prove an approved provider can load and update the self-service dashboard.
          docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -c \
            "delete from vendor_portal_tokens where vendor_id='v_prescott_zebrascapes';
             insert into vendor_portal_tokens(vendor_id,token_hash,expires_at)
             values('v_prescott_zebrascapes',encode(digest('ci-provider-token','sha256'),'hex'),now()+interval '1 day');"

          curl -fsS 'http://127.0.0.1:8000/api/provider/dashboard?token=ci-provider-token' >/tmp/bmc_provider_dashboard.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_provider_dashboard.json"))
          assert data["ok"] is True
          assert data["provider"]["vendor_id"] == "v_prescott_zebrascapes"
          assert data["provider"]["status"] == "pilot"
          assert isinstance(data["opportunities"], list)
          assert isinstance(data["active_jobs"], list)
          PY

          curl -fsS -X POST http://127.0.0.1:8000/api/provider/settings \
            -H 'Content-Type: application/json' \
            -d '{"token":"ci-provider-token","capacity":"4 new jobs per week","minimum_job":"750","territory_notes":"Prescott, Prescott Valley","markets":["Prescott","Prescott Valley"],"services":["landscaping","tree_service"]}' \
            >/tmp/bmc_provider_settings.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_provider_settings.json"))
          assert data["ok"] is True
          PY
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select capacity from vendors where vendor_id='v_prescott_zebrascapes';")" = "4 new jobs per week"
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from vendor_markets where vendor_id='v_prescott_zebrascapes';")" -eq 2

          curl -fsS -X POST http://127.0.0.1:8000/api/intake             -H 'Content-Type: application/json'             -d '{"submission_id":"ci-smoke-lead","form_type":"tree_service","market":"Prescott","scope":"CI smoke test: tree removal request","timing":"Within 7 days","consent":"yes"}'             >/tmp/bmc_intake.json
          cat /tmp/bmc_intake.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_intake.json"))
          assert data["ok"] is True
          assert data.get("lead_id")
          PY
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from leads where submission_id='ci-smoke-lead';")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select customer_path from leads where submission_id='ci-smoke-lead';")" = "fix_or_handle_job"

          # Prove one building request can split into several service jobs.
          curl -fsS -X POST http://127.0.0.1:8000/api/intake \
            -H 'Content-Type: application/json' \
            -d '{"submission_id":"ci-facility-request","form_type":"facility_maintenance","market":"Prescott","facility_type":"Church / place of worship","business_name":"CI Church","contact_name":"CI Manager","email":"ci-facility@example.com","scope":"Weekly cleaning, parking lot light repair, and electrical work","timing":"Within 30 days","need_commercial_cleaning":"yes","need_parking_lot":"yes","need_electrical":"yes","consent":"yes","customer_path":"keep_it_handled"}' \
            >/tmp/bmc_facility.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_facility.json"))
          assert data["ok"] is True
          assert data["status"] == "split"
          assert data["child_requests"] == 3
          PY
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from leads where parent_lead_id=(select lead_id from leads where submission_id='ci-facility-request');")" -eq 3
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from leads where parent_lead_id=(select lead_id from leads where submission_id='ci-facility-request') and customer_path='keep_it_handled';")" -eq 3

          # Prove a real provider match can be accepted and releases the contact handoff event.
          docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -c "update vendors set status='pilot' where vendor_id='v_prescott_tree_morgan';"
          curl -fsS -X POST http://127.0.0.1:8000/api/intake \
            -H 'Content-Type: application/json' \
            -d '{"submission_id":"ci-match-lead","form_type":"tree_service","market":"Prescott","contact_name":"CI Customer","email":"ci-customer@example.com","phone":"9285550100","scope":"Dead pine leaning toward garage","timing":"Within 7 days","consent":"yes"}' \
            >/tmp/bmc_match.json
          cat /tmp/bmc_match.json
          export MATCH_LEAD_ID="$(python -c 'import json; print(json.load(open("/tmp/bmc_match.json"))["lead_id"])')"
          export MATCH_TOKEN="$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select response_token from lead_matches where lead_id='$MATCH_LEAD_ID'::uuid and vendor_id='v_prescott_tree_morgan' and status='offered' limit 1;")"
          test -n "$MATCH_TOKEN"
          python - <<'PY' >/tmp/bmc_vendor_response.json
          import json, os
          print(json.dumps({
            "form_type":"vendor_response",
            "lead_id":os.environ["MATCH_LEAD_ID"],
            "vendor_id":"v_prescott_tree_morgan",
            "token":os.environ["MATCH_TOKEN"],
            "response":"accept"
          }))
          PY
          curl -fsS -X POST http://127.0.0.1:8000/api/intake \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/bmc_vendor_response.json \
            >/tmp/bmc_accept.json
          cat /tmp/bmc_accept.json
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select status from leads where lead_id='$MATCH_LEAD_ID'::uuid;")" = "provider_accepted"
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from events where entity_type='lead' and entity_id='$MATCH_LEAD_ID' and event_type='contact_released';")" -eq 1
          # Prove BMC-delivered products create internal work, not provider matches.
          curl -fsS -X POST http://127.0.0.1:8000/api/intake \
            -H 'Content-Type: application/json' \
            -d '{"submission_id":"ci-growth-intake","form_type":"growth_pack","market":"Prescott","contact_name":"CI Growth Buyer","business_name":"CI Growth Co","email":"ci-growth@example.com","scope":"Build a targeted local prospecting package","timing":"Within 30 days","consent":"yes"}' \
            >/tmp/bmc_growth.json
          cat /tmp/bmc_growth.json
          export GROWTH_LEAD_ID="$(python -c 'import json; print(json.load(open("/tmp/bmc_growth.json"))["lead_id"])')"
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select status from leads where lead_id='$GROWTH_LEAD_ID'::uuid;")" = "internal_queue"
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select customer_path from leads where lead_id='$GROWTH_LEAD_ID'::uuid;")" = "help_me_get_more_customers"
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from tasks where lead_id='$GROWTH_LEAD_ID'::uuid and task_type='fulfill_internal_product';")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from lead_matches where lead_id='$GROWTH_LEAD_ID'::uuid;")" -eq 0

          export PAYLOAD='{"id":"evt_ci_checkout_1","type":"checkout.session.completed","data":{"object":{"id":"cs_ci_1","mode":"payment","payment_status":"paid","amount_total":49900,"currency":"usd","customer_details":{"email":"ci-growth@example.com"},"metadata":{"product_key":"growth_pack_starter"}}}}'
          export TS="$(date +%s)"
          SIG="$(python -c 'import os,hmac,hashlib; print(hmac.new(b"whsec_ci_test",(os.environ["TS"]+".").encode()+os.environ["PAYLOAD"].encode(),hashlib.sha256).hexdigest())')"
          curl -fsS -X POST http://127.0.0.1:8000/api/stripe-webhook             -H 'Content-Type: application/json'             -H "Stripe-Signature: t=$TS,v1=$SIG"             --data-binary "$PAYLOAD" >/tmp/bmc_stripe.json
          cat /tmp/bmc_stripe.json
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from payment_events where stripe_event_id='evt_ci_checkout_1';")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select coalesce(sum(amount_cents),0) from revenue_events where model='stripe_checkout';")" -eq 49900
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from orders where stripe_checkout_session_id='cs_ci_1' and product_key='growth_pack_starter';")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select status from orders where stripe_checkout_session_id='cs_ci_1';")" = "ready_for_fulfillment"
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from tasks where lead_id='$GROWTH_LEAD_ID'::uuid and order_id is not null;")" -eq 1
          curl -fsS -X POST http://127.0.0.1:8000/api/stripe-webhook             -H 'Content-Type: application/json'             -H "Stripe-Signature: t=$TS,v1=$SIG"             --data-binary "$PAYLOAD" >/tmp/bmc_stripe_duplicate.json
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from payment_events where stripe_event_id='evt_ci_checkout_1';")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select coalesce(sum(amount_cents),0) from revenue_events where model='stripe_checkout';")" -eq 49900
      - name: Show automation logs on failure
        if: failure()
        working-directory: portfolio/automation
        run: |
          if [ -f .env.ci ]; then
            docker compose --env-file .env.ci logs --no-color postgres ops_api || true
          fi
      - name: Tear down smoke stack
        if: always()
        working-directory: portfolio/automation
        run: |
          docker rm -f research-mock 2>/dev/null || true
          if [ -f .env.ci ]; then
            docker compose --env-file .env.ci down -v || true
          fi
