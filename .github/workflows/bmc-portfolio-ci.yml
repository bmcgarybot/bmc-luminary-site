name: BMC Portfolio CI

on:
  push:
    paths:
      - "portfolio/**"
      - ".github/workflows/bmc-portfolio-ci.yml"
  pull_request:
    paths:
      - "portfolio/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate API syntax
        run: python -m py_compile portfolio/automation/api/app.py
      - name: Validate VPS GitOps relay
        working-directory: portfolio/automation
        run: |
          python3 -m py_compile vps-gitops-relay.py
          python3 - <<'PY'
          import runpy
          ns=runpy.run_path("vps-gitops-relay.py",run_name="bmc_relay_ci")
          expected={
              "proof_readout","launch_audit","runtime_doctor","diagnostic_bundle","scheduler_status","search_quality_probe","research_refresh_status",
              "growth_status","growth_launch_audit",
              "deploy_update","market_inventory_step","local_demand_step",
              "public_opportunities_step","source_native_step","assistant_bootstrap_import","assistant_licensed_bootstrap_import","inventory_closure_step","research_refresh_install","scheduler_start","scheduler_stop",
              "growth_stage_pressure_washing","growth_stage_commercial_cleaning","growth_launch_enable","growth_launch_disable","growth_owner_replay_email","owner_replay_all_email_templates","growth_owner_preview_approve"
          }
          assert ns["ALLOWED_ACTIONS"] == expected, ns["ALLOWED_ACTIONS"]
          assert all("shell" not in x for x in ns["ALLOWED_ACTIONS"])
          assert ns["RELAY_BRANCH"] == "vps-relay"
          PY
          grep -q 'allow_external_actions' vps-gitops-relay.py
          ! grep -q 'shell=True' vps-gitops-relay.py

      - name: Validate service registry and fronts
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path("portfolio")
          data=json.loads((root/"data/services.json").read_text())
          services=data["services"]
          assert len(services) >= 54, f"Expected >=54 services, got {len(services)}"
          missing=[]
          dup=set(); seen=set()
          for s in services:
              key=s["service_key"]
              if key in seen: dup.add(key)
              seen.add(key)
              front=s.get("live_front","")
              if front.startswith("/portfolio/"):
                  rel=front[len("/portfolio/"):].strip("/")
                  if not (root/rel/"index.html").exists(): missing.append((key,front))
          assert not dup, f"Duplicate service keys: {sorted(dup)}"
          assert not missing, f"Missing service fronts: {missing}"
          print(f"Validated {len(services)} registered services")
          # GROWTH_LAUNCH_CONTRACT_V1
          growth=(root/"growth-packs"/"index.html").read_text()
          pressure=(root/"growth-packs"/"pressure-washing"/"index.html").read_text()
          cleaning=(root/"growth-packs"/"commercial-cleaning"/"index.html").read_text()
          core=(root/"assets"/"core.js").read_text()
          sitemap=(root/"sitemap.xml").read_text()
          schema=(root/"automation"/"schema.sql").read_text()
          api=(root/"automation"/"api"/"app.py").read_text()
          scheduler=(root/"automation"/"scheduler.sh").read_text()
          assert "Show me 5 free targets" in growth
          assert 'data-form-type="growth_snapshot"' in pressure
          assert 'name="service_key" value="pressure_washing"' in pressure
          assert 'data-form-type="growth_snapshot"' in cleaning
          assert 'name="service_key" value="commercial_cleaning"' in cleaning
          assert "/growth-packs/pressure-washing/" in sitemap
          assert "response.sample" in core and "Get the full 100 for $499" in core
          assert "maybeClaimGrowthSample" in core and 'preview:q.get("preview")||""' in core
          assert "growth_claim_token" in api and "one_click_sample_claimed" in api
          assert "growth_lock_exposure_allocator" in api and "growth_exposure_filter" in api
          assert "growth_record_exposures" in api and "GROWTH_FREE_DISTINCT_90D" in api
          assert "approved_domains" in api and "growth_source_rights_review" in api
          assert "owner_template_preview_catalog" in api and "replay-all-email-templates-to-owner" in api
          assert "OWNER PREVIEW" in api and "count_sent" in api
          for table in ("growth_experiment_cells","growth_outreach_targets","growth_sample_requests","growth_sample_prospects","growth_order_prospects","growth_prospect_exposures","growth_prospect_suppressions","growth_source_rights_review"):
              assert f"create table if not exists {table}" in schema, table
          for endpoint in ("/api/admin/stage-growth-pressure-washing","/api/admin/growth-status","/api/process-growth-health","/api/process-growth-nurture","/api/process-growth-fulfillment","/api/growth/claim-free-five"):
              assert endpoint in api, endpoint
          assert "GROWTH_SAMPLE_MIN_RESERVE" in api
          assert "SMTP_FROM_NAME" in api
          assert "def growth_outreach_message" in api
          assert "Reply <strong>no</strong>" in api
          assert "This is a promotional email from BMC Service Network." in api
          assert "copy and paste this link" not in api
          readiness=(root/"automation"/"growth-launch-readiness.sh").read_text()
          env_example=(root/"automation"/".env.example").read_text()
          assert "GROWTH_OWNER_APPROVED_SHA" in readiness
          assert "GROWTH_OWNER_APPROVED_SHA=" in env_example
          assert "growth_sample_id" in api
          assert "post /api/process-growth-health" in scheduler
          assert "post /api/process-growth-nurture" in scheduler
          assert "post /api/process-growth-fulfillment" in scheduler

          import re
          allowed=set(s["service_key"] for s in services) | {"universal_request","vendor_partner","vendor_pilot_activation","vendor_response","job_update","facility_maintenance","growth_snapshot"}
          invalid=[]
          forms=0
          for html in root.rglob("*.html"):
              text=html.read_text(errors="ignore")
              for form_type in re.findall(r'data-form-type="([^"]+)"',text):
                  forms+=1
                  if form_type not in allowed:
                      invalid.append((str(html),form_type))
          assert not invalid, f"Invalid form types: {invalid}"
          print(f"Validated {forms} form endpoints")
          required=[
              root/"solutions/index.html",
              root/"provider-login/index.html",
              root/"provider-dashboard/index.html",
              root/"providers/index.html",
              root/"services/index.html",
          ]
          missing_required=[str(p) for p in required if not p.exists()]
          assert not missing_required, f"Missing required public surfaces: {missing_required}"
          print("Validated provider portal and solution hub surfaces")
          PY
      - name: Validate generated priority storefronts
        run: python portfolio/automation/generate-storefronts.py --check

      - name: Reject legacy public UI
        run: python portfolio/automation/validate-public-ui.py

      - name: Reject internal language in public copy
        run: python portfolio/automation/validate-public-copy.py

      - name: Validate public form contracts
        run: python portfolio/automation/validate-form-contracts.py

      - name: Validate public form retry and rendering safety
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path("portfolio/assets/core.js").read_text()
          assert "form.dataset.submissionId" in core
          assert "data.submission_id=form.dataset.submissionId" in core
          assert "delete form.dataset.submissionId" in core
          assert "controller.abort(),15000" in core
          assert "card.replaceChildren()" in core
          assert "message.textContent=response.message" in core
          assert 'card.innerHTML="<h3>"' not in core
          assert 'sessionStorage.setItem("bmc_pending_submission",JSON.stringify(data))' not in core
          order=Path("portfolio/order-complete/index.html").read_text()
          for key in ("growth_pack_starter","growth_pack_premium","competitor_intelligence_pack","market_expansion_pack"):
              assert key in order
          for legacy in ("'growth-pack':","'growth-pack-premium':","'competitor-intelligence':","'market-expansion':"):
              assert legacy not in order
          PY

      - name: Validate services SEO crawlability
        working-directory: portfolio
        run: |
          grep -q '<meta name="robots" content="index,follow">' services/index.html
          grep -q '<link rel="canonical" href="https://bmcservicenetwork.com/services/">' services/index.html
          test "$(grep -o 'class="venture-card"' services/index.html | wc -l)" -ge 54
          grep -q 'href="/commercial-cleaning/"' services/index.html
          grep -q 'href="/tree-service/"' services/index.html
          grep -q 'href="/auto-repair-shop/"' services/index.html

      - name: Validate assistant directory bootstrap
        working-directory: portfolio/automation
        run: |
          python3 -m py_compile assistant-directory-bootstrap.py assistant-homversa-bootstrap.py build-assistant-research-seed.py
          python3 build-assistant-research-seed.py --output /tmp/bmc-assistant-census-seed.sql --summary-json 2>/tmp/bmc-assistant-census-summary.json
          cat /tmp/bmc-assistant-census-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary=json.load(open("/tmp/bmc-assistant-census-summary.json"))
          assert summary["artifacts"] >= 74, summary
          assert summary["raw_rows"] >= 7879, summary
          assert len(summary["markets"]) == 21, summary
          assert summary["unique_rows"] > 0, summary
          assert set(summary["raw_by_side"]) == {"buyer","vendor"}, summary
          seed=Path("/tmp/bmc-assistant-census-seed.sql").read_text()
          assert "artifact_files" in seed
          assert "on conflict(side,market,category_key,source_url,business_name)" in seed
          PY
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("assistant-directory-bootstrap.py")
          spec=importlib.util.spec_from_file_location("adb",p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          sample='''<a href="/alpha-auto-repair-12345">Alpha Auto Repair</a><div>12 Main St.</div><div>Kingman AZ 86401</div><div>(928) 555-1212</div><a href="https://www.whereorg.com/city-government-99999">City Government</a><div>1 Civic Way</div><div>Kingman AZ 86401</div><div>(928) 555-9999</div><div>Whereorg has 2 results under Companies in Kingman, AZ.</div>'''
          rows=m.parse_listing(sample,"Kingman")
          assert len(rows)==2, rows
          assert rows[0]["business_name"]=="Alpha Auto Repair"
          assert rows[0]["phone"]=="(928) 555-1212"
          dewey='''<a href="/dewey-auto-123">Dewey Auto</a><div>10 Main St.</div><div>Dewey AZ 86327</div><div>(928) 555-0101</div><div>Whereorg has 1 results under Companies in Dewey, AZ.</div>'''
          drows=m.parse_listing(dewey,"Dewey-Humboldt")
          assert len(drows)==1 and drows[0]["business_name"]=="Dewey Auto", drows
          assert m.MARKETS["Dewey-Humboldt"]=="dewey"
          assert m.classify("automotive-services","Alpha Auto Repair")[1]=="auto_repair_shop"
          assert m.classify("government","City Government")[1]=="public_facilities"
          assert len(m.MARKETS)==21
          assert len(m.FEEDS)>=10
          schema=Path("schema.sql").read_text()
          assert "source_tier text not null default 'discovery'" in schema
          assert "verification_status text not null default 'discovery'" in schema
          assert "create table if not exists research_refresh_state" in schema
          assert "last_closure_checked_at" in schema
          assert "create or replace view market_inventory_business_rollup" in schema
          api=Path("api/app.py").read_text()
          assert '"direct_evidence" if official else ("closed_evidence" if closure_reason else "discovery")' in api
          proof=Path("production-proof-readout.sh").read_text()
          assert "Candidate evidence tiers:" in proof
          relay=Path("vps-gitops-relay.py").read_text()
          assert '"assistant_bootstrap_import"' in relay
          importer=Path("assistant-directory-bootstrap.py").read_text()
          assert "source_tier=excluded.source_tier" in importer
          assert "verification_status=excluded.verification_status" in importer
          assert "DATABASE_URL" in importer
          assert "status=case when market_inventory_candidates.status='closed' then 'closed' else 'discovered' end" in importer
          assert "discover_category_pages" in importer
          assert "general_business" in importer
          assert "--max-pages-per-market" in importer
          page_links=m.discover_category_pages('<a href="/businesses/restaurants-and-bars-in-kingman-az-02">2</a><a href="/businesses/restaurants-and-bars-in-kingman-az-05">5</a>',"kingman")
          assert len(page_links)==2, page_links
          assert page_links[0][0].endswith("-02"), page_links
          assert "pages_remaining_at_safety_ceiling" in importer
          assert "class ListingParser" not in importer
          assert "def normalize_company_href" in importer
          assert "empty_feeds" in importer
          assert "drop constraint if exists market_inventory_candidates_side_market_category_key_source_url;" in schema
          licensed=Path("assistant-homversa-bootstrap.py")
          assert licensed.exists()
          spec2=importlib.util.spec_from_file_location("ahb",licensed)
          m2=importlib.util.module_from_spec(spec2); spec2.loader.exec_module(m2)
          sample2='''<html><body><a href="/az/kingman/plumbers">Plumbers in Kingman, AZ</a></body></html>'''
          trades=m2.discover_trades(sample2,"kingman")
          assert trades and trades[0][0]=="plumbers", trades
          page2='''<html><body><div>Checked as of September 21, 2026</div><div>1.</div><a>Alpha Plumbing LLC</a><div>On the ROC register since 2001.</div><div>ROC License</div><div>#123456</div><li>Beta Plumbing LLC - ROC #234567</li></body></html>'''
          parsed=m2.parse_trade_page(page2,"Kingman","plumbers")
          names={x["business_name"] for x in parsed["records"]}
          assert {"Alpha Plumbing LLC","Beta Plumbing LLC"} <= names, parsed
          assert m2.trade_lane("plumbers")[0]=="backflow_plumbing"
          assert m2.trade_lane("masonry-contractors")[0]=="facility_maintenance"
          assert "DATABASE_URL" in licensed.read_text()
          relay=Path("vps-gitops-relay.py").read_text()
          assert '"assistant_licensed_bootstrap_import"' in relay
          assert '"inventory_closure_step"' in relay
          assert "research_refresher" in relay
          assert "status=\"monitoring\"" in api
          assert "scan_cycles=scan_cycles+case when" in api
          assert "def inventory_result_closed" in api
          PY

      - name: Validate research query quality
        working-directory: portfolio/automation
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source=Path("api/app.py").read_text()
          tree=ast.parse(source)
          names={"inventory_query","build_local_signal_query","result_matches_market","local_signal_request_intent","local_signal_result_relevant"}
          funcs=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in names]
          ns={"clean":lambda v:str(v or "").strip(),"re":__import__("re")}
          exec(compile(ast.Module(body=funcs,type_ignores=[]),"query-check","exec"),ns)
          q=ns["inventory_query"]("vendor","Prescott","Restaurant Equipment Repair",0)
          assert q.lower()=="restaurant equipment repair prescott arizona", q
          b=ns["inventory_query"]("buyer","Prescott","hospitals medical centers clinics",0)
          assert '"hospitals medical centers clinics"' not in b, b
          d=ns["build_local_signal_query"]("Prescott","facebook.com",'"restaurant equipment" OR "ice machine"',0)
          assert d.startswith("site:facebook.com Prescott Arizona "), d
          assert " OR " not in d, d
          local_good={"title":"Prescott neighbor looking for a plumber","snippet":"Need a plumber in Prescott Arizona","url":"https://prescott.craigslist.org/services/example"}
          local_wrong_city={"title":"Phoenix neighbor looking for a plumber","snippet":"Need a plumber in Phoenix Arizona","url":"https://phoenix.craigslist.org/services/example"}
          local_prescott_valley={"title":"Prescott Valley neighbor looking for a plumber","snippet":"Need a plumber in Prescott Valley Arizona","url":"https://example.com/prescott-valley"}
          local_compact_prescott_valley={"title":"Need a plumber","snippet":"Looking for service","url":"https://prescottvalley.example.com/post"}
          local_job={"title":"Bullhead City Experienced Plumber Needed - $2,000 Sign-On Bonus","snippet":"Skilled trades job opening in Bullhead City Arizona","url":"https://craigslist.org/view/job"}
          local_vendor_ad={"title":"Kindred Cleaning Company - household services - craigslist","snippet":"Bullhead City Arizona cleaning company. Call us for a free estimate.","url":"https://craigslist.org/view/service"}
          assert ns["local_signal_result_relevant"](local_good,"Prescott") is True
          assert ns["local_signal_result_relevant"](local_wrong_city,"Prescott") is False
          assert ns["local_signal_result_relevant"](local_prescott_valley,"Prescott") is False
          assert ns["local_signal_result_relevant"](local_prescott_valley,"Prescott Valley") is True
          assert ns["local_signal_result_relevant"](local_compact_prescott_valley,"Prescott") is False
          assert ns["local_signal_result_relevant"](local_job,"Bullhead City") is False
          assert ns["local_signal_result_relevant"](local_vendor_ad,"Bullhead City") is False
          print(q)
          print(b)
          print(d)
          PY

      - name: Validate search and download readiness
        run: python portfolio/automation/validate-search-readiness.py

      - name: Validate research search engines
        working-directory: portfolio/automation
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("searxng/settings.yml").read_text()
          for name in ("brave","duckduckgo","google cse","bing","qwant"):
              block=text.split(f"- name: {name}",1)[1].split("- name:",1)[0]
              assert "disabled: true" in block, (name,block)
          for name in ("yahoo","yep"):
              block=text.split(f"- name: {name}",1)[1].split("- name:",1)[0]
              assert "disabled: false" in block, (name,block)
          api=Path("api/app.py").read_text()
          assert "def inventory_result_relevant" in api
          assert "relevant_results=[r for r in results" in api
          import ast, re
          tree=ast.parse(api)
          nodes=[]
          for n in tree.body:
              if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=="INVENTORY_BLOCKED_DOMAINS" for t in n.targets):
                  nodes.append(n)
              if isinstance(n,ast.FunctionDef) and n.name in {"result_matches_market","inventory_result_relevant","inventory_official_site","inventory_result_closed","inventory_result_matches_business"}:
                  nodes.append(n)
          ns={"clean":lambda v:str(v or "").strip(),"re":re}
          exec(compile(ast.Module(body=nodes,type_ignores=[]),"relevance-check","exec"),ns)
          good={"title":"CRRS Restaurant Equipment Repair Prescott","snippet":"Commercial refrigeration and restaurant equipment repair in Prescott AZ","url":"https://prescottrepairs.com/commercial_repair"}
          wrong_city={"title":"Phoenix Restaurant Equipment Repair","snippet":"Restaurant equipment repair in Phoenix Arizona","url":"https://example.com/phoenix"}
          supplier_only={"title":"Restaurant Equipment Supply Prescott","snippet":"New and used restaurant equipment, parts and kitchen smallwares in Prescott","url":"https://supplier.example/prescott"}
          prescott_valley_only={"title":"Prescott Valley Restaurant Equipment Repair","snippet":"Commercial repair in Prescott Valley AZ","url":"https://example.com/prescott-valley/repair"}
          direct_site={"title":"State Farm Insurance Agent Tracy Murr in Prescott AZ","snippet":"Local insurance office in Prescott Arizona","url":"https://tracymurr.com/","domain":"tracymurr.com"}
          directory_site={"title":"Dog Friendly Restaurants in Prescott, AZ - BringFido","snippet":"Restaurant list in Prescott Arizona","url":"https://www.bringfido.com/restaurant/city/prescott_az_us/","domain":"bringfido.com"}
          listicle_site={"title":"Prescott's Top Four Restaurants","snippet":"Guide to restaurants in Prescott Arizona","url":"https://example-local.com/top-restaurants","domain":"example-local.com"}
          marketplace_site={"title":"Apartments for Rent in Bullhead City, AZ","snippet":"Bullhead City Arizona listings","url":"https://www.realtor.com/apartments/Bullhead-City_AZ","domain":"realtor.com"}
          assert ns["inventory_result_relevant"](good,"Prescott","Restaurant Equipment Repair") is True
          assert ns["inventory_result_relevant"](wrong_city,"Prescott","Restaurant Equipment Repair") is False
          assert ns["inventory_result_relevant"](wrong_city,"Prescott","Restaurant Equipment Repair","buyer") is False
          assert ns["inventory_result_relevant"](wrong_city,"Prescott","Restaurant Equipment Repair","vendor") is True
          assert ns["inventory_result_relevant"](supplier_only,"Prescott","Restaurant Equipment Repair") is False
          assert ns["inventory_result_relevant"](prescott_valley_only,"Prescott","Restaurant Equipment Repair") is False
          assert ns["inventory_result_relevant"](prescott_valley_only,"Prescott Valley","Restaurant Equipment Repair") is True
          assert ns["inventory_official_site"](direct_site) is True
          assert ns["inventory_official_site"](directory_site) is False
          assert ns["inventory_official_site"](listicle_site) is False
          assert ns["inventory_official_site"](marketplace_site) is False
          closed_hit={"title":"CRRS Restaurant Equipment Repair - Permanently Closed","snippet":"Prescott Arizona business has permanently closed","url":"https://example.com/crrs-closed"}
          open_hit={"title":"CRRS Restaurant Equipment Repair","snippet":"Open for service in Prescott Arizona","url":"https://example.com/crrs"}
          assert ns["inventory_result_closed"](closed_hit)=="permanently closed"
          assert ns["inventory_result_closed"](open_hit) is None
          assert ns["inventory_result_matches_business"](closed_hit,"CRRS Restaurant Equipment Repair") is True
          assert ns["inventory_result_matches_business"](closed_hit,"Subway") is False
          assert '@app.post("/api/process-inventory-closure-audit")' in api
          assert '@app.get("/api/admin/inventory-businesses")' in api
          assert '@app.get("/api/admin/inventory-business-evidence")' in api
          assert "last_closure_checked_at" in api
          assert "superpages.com" in api and "allbiz.com" in api and "restaurantji.com" in api
          assert "INVENTORY_QUERY_STRATEGY_VERSION=7" in api
          assert "LOCAL_DEMAND_QUERY_STRATEGY_VERSION=7" in api
          assert "local_signal_result_relevant(result,lane[\"market\"])" in api
          assert "query_strategy_version=excluded.query_strategy_version" in api
          schema=Path("schema.sql").read_text()
          assert "query strategy v4 establishes a clean audited baseline" in schema.lower()
          assert "query strategy v5 requires explicit target-market evidence" in schema.lower()
          assert "inventory v5 and local-demand v6 require an exact normalized market phrase" in schema.lower()
          assert "inventory v6 rejects obvious directory/listicle pages" in schema.lower()
          assert "inventory v7 broadens direct-site exclusions" in schema.lower()
          assert "superseded_pre_v4" in schema
          assert "superseded_pre_v5" in schema
          assert "superseded_pre_v6" in schema
          assert "query_strategy_version=7" in schema
          proof=Path("production-proof-readout.sh").read_text()
          assert "candidate_rows_active_v7" in proof
          assert "superseded_candidate_rows" in proof
          assert "demand_signal_rows_active_v7" in proof
          assert "superseded_demand_signal_rows" in proof
          assert "Recent active inventory sample:" in proof
          assert "Active demand sample:" in proof
          PY
          grep -q 'up -d --force-recreate searxng' deploy-update.sh

      - name: Validate Compose
        working-directory: portfolio/automation
        run: |
          docker compose --env-file .env.example config >/dev/null
          docker compose --env-file .env.example build research_refresher
          grep -q 'research_refresher:' docker-compose.yml
          grep -q 'research-refresher.Dockerfile' docker-compose.yml
          grep -q 'up -d --build research_refresher' deploy-update.sh
          grep -q 'Continuous bulk research refresher is running' runtime-doctor.sh
          grep -q 'research_refresh_state' schema.sql
          grep -q 'image: cloudflare/cloudflared:2026.10.3' docker-compose.yml
          grep -q 'pull cloudflared' deploy-update.sh
          grep -q 'pull cloudflared' configure-cloudflare.sh
          grep -q 'Cloudflare Tunnel is running patched cloudflared' runtime-doctor.sh

      - name: Validate outbound safety invariants
        working-directory: portfolio/automation
        run: |
          python - <<'PY'
          from pathlib import Path
          api = Path("api/app.py").read_text()
          start = api.index('@app.post("/api/process-followups")')
          end = api.index('def pilot_activation_url', start)
          block = api[start:end]
          assert "if not OUTREACH_ENABLED" in block
          assert '"sent":0' in block
          deploy = Path("deploy-update.sh").read_text()
          assert 'up -d --force-recreate scheduler' in deploy
          scheduler = Path("scheduler.sh").read_text()
          assert '[scheduler] POST $endpoint' in scheduler
          assert "/api/process-inventory-closure-audit" in scheduler
          PY

      - name: Validate operational scripts
        working-directory: portfolio/automation
        run: |
          bash -n provision-cloud.sh bootstrap.sh start.sh stop.sh backup.sh runtime-doctor.sh deploy-update.sh \
            configure-cloudflare.sh verify-public-ingress.sh verify-backup.sh install-backup-timer.sh \
            expand-source-native-markets.sh configure-stripe-webhook.sh drain-research-backlog.sh launch-readiness.sh growth-launch-readiness.sh \
            stage-outreach-wave.sh install-vps-gitops-relay.sh research-source-refresh.sh \
            install-research-refresh-timers.sh research-refresh-status.sh
          sh -n scheduler.sh research-refresher-loop.sh

      - name: Validate public gateway configuration
        working-directory: portfolio/automation
        run: |
          docker run --rm \
            --add-host ops_api:127.0.0.1 \
            --add-host n8n:127.0.0.1 \
            -v "$PWD/nginx-webhooks.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: Boot database and API smoke test
        working-directory: portfolio/automation
        run: |
          cp .env.example .env.ci
          sed -i 's/^SMTP_DRY_RUN=.*/SMTP_DRY_RUN=true/' .env.ci
          sed -i 's#^STRIPE_WEBHOOK_SECRET=.*#STRIPE_WEBHOOK_SECRET=whsec_ci_test#' .env.ci
          sed -i 's#^BMC_ADMIN_KEY=.*#BMC_ADMIN_KEY=ci_admin_key#' .env.ci
          sed -i 's#^RESEARCH_SEARCH_URL=.*#RESEARCH_SEARCH_URL=http://research-mock:8080/search#' .env.ci
          sed -i 's#^SOURCE_NATIVE_MARKETS=.*#SOURCE_NATIVE_MARKETS=Prescott#' .env.ci
          sed -i 's#^SOURCE_NATIVE_CHECK_BATCH=.*#SOURCE_NATIVE_CHECK_BATCH=5#' .env.ci
          sed -i 's#^ADHS_FACILITIES_URL=.*#ADHS_FACILITIES_URL=http://research-mock:8080/adhs#' .env.ci
          sed -i 's#^ADHS_SOURCE_NATIVE_PAGE_SIZE=.*#ADHS_SOURCE_NATIVE_PAGE_SIZE=10#' .env.ci
          sed -i 's#^CMS_SOURCE_NATIVE_ENABLED=.*#CMS_SOURCE_NATIVE_ENABLED=true#' .env.ci
          sed -i 's#^CMS_SOURCE_NATIVE_PAGE_SIZE=.*#CMS_SOURCE_NATIVE_PAGE_SIZE=10#' .env.ci
          sed -i 's#^CMS_HOSPITALS_URL=.*#CMS_HOSPITALS_URL=http://research-mock:8080/cms-hospitals#' .env.ci
          sed -i 's#^CMS_NURSING_HOMES_URL=.*#CMS_NURSING_HOMES_URL=http://research-mock:8080/cms-nursing#' .env.ci
          sed -i 's#^CMS_HOME_HEALTH_URL=.*#CMS_HOME_HEALTH_URL=http://research-mock:8080/cms-home-health#' .env.ci
          sed -i 's#^CMS_HOSPICE_URL=.*#CMS_HOSPICE_URL=http://research-mock:8080/cms-hospice#' .env.ci
          docker compose --env-file .env.ci up -d postgres

          # Production bootstrap owns schema/seed application. CI must mirror that
          # behavior rather than depending on docker-entrypoint-initdb.d.
          for i in $(seq 1 60); do
            logs="$(docker compose --env-file .env.ci logs --no-color postgres 2>&1 || true)"
            if printf '%s' "$logs" | grep -Eq 'PostgreSQL init process complete; ready for start up|Skipping initialization'; then
              break
            fi
            sleep 1
          done
          ready=0
          for i in $(seq 1 60); do
            if docker compose --env-file .env.ci exec -T postgres pg_isready -U bmc_automation -d bmc_portfolio >/dev/null 2>&1; then
              ready=$((ready+1))
              if [ "$ready" -ge 3 ]; then break; fi
            else
              ready=0
            fi
            sleep 1
          done
          test "$ready" -ge 3

          python3 build-assistant-research-seed.py --output /tmp/bmc-assistant-census-seed.sql --summary-json 2>/tmp/bmc-assistant-census-summary.json
          echo "assistant census artifact summary:"
          cat /tmp/bmc-assistant-census-summary.json

          for file in schema.sql seed-services.sql seed-vendors.sql seed-buyers.sql seed-outreach.sql seed-buyer-outreach.sql seed-growth-pack-sales.sql seed-first-wave.sql seed-products.sql seed-research.sql seed-research-sources.sql seed-research-scale.sql; do
            docker compose --env-file .env.ci exec -T postgres psql -v ON_ERROR_STOP=1 -U bmc_automation -d bmc_portfolio < "$file"
          done
          docker compose --env-file .env.ci exec -T postgres psql -v ON_ERROR_STOP=1 -U bmc_automation -d bmc_portfolio < /tmp/bmc-assistant-census-seed.sql
          docker compose --env-file .env.ci exec -T postgres psql -v ON_ERROR_STOP=1 -U bmc_automation -d bmc_portfolio < seed-assistant-williamson-bootstrap.sql

          docker compose --env-file .env.ci up -d --build ops_api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/bmc_health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/bmc_health.json
          POSTGRES_CONTAINER="$(docker compose --env-file .env.ci ps -q postgres)"
          BMC_NETWORK="$(docker inspect "$POSTGRES_CONTAINER" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')"
          docker run -d --rm --name research-mock --network "$BMC_NETWORK" -v "$PWD/ci:/srv:ro" python:3.12-alpine python -m http.server 8080 --directory /srv
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc 'select count(*) from research_sources where is_active=true;')" -ge 12
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc 'select count(*) from services;')" -ge 54
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from services where service_key='auto_repair_shop' and is_active=true;")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc 'select count(*) from vendors;')" -ge 111
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc 'select count(*) from buyers;')" -ge 140
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from research_backlog where status='queued';")" -ge 600

          # Regression: routine scale/migration reruns must never resurrect terminal research.
          docker compose --env-file .env.ci exec -T postgres psql -v ON_ERROR_STOP=1 -U bmc_automation -d bmc_portfolio -c "
            insert into research_backlog(
              market,service_key,side,market_priority,target_gap,current_count,goal,
              research_priority,research_method,status,research_pass,candidates_found,notes
            ) values
              ('CI Migration Terminal Completed','commercial_cleaning','vendor','TIER2',10,0,10,'MEDIUM','ci','completed',1,0,'CI terminal-state migration guard'),
              ('CI Migration Terminal Review','commercial_cleaning','vendor','TIER2',10,0,10,'MEDIUM','ci','review',1,0,'CI terminal-state migration guard'),
              ('CI Migration Terminal NoResult','commercial_cleaning','vendor','TIER2',10,0,10,'MEDIUM','ci','searched_no_results',1,0,'CI terminal-state migration guard');"
          docker compose --env-file .env.ci exec -T postgres psql -v ON_ERROR_STOP=1 -U bmc_automation -d bmc_portfolio < seed-research-scale.sql
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "
            select count(*) from research_backlog
            where (market,status) in (
              ('CI Migration Terminal Completed','completed'),
              ('CI Migration Terminal Review','review'),
              ('CI Migration Terminal NoResult','searched_no_results')
            );")" -eq 3
          docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -c "
            delete from research_backlog where market like 'CI Migration Terminal %';"

          # Controlled wave staging must queue only selected research prospects and never send.
          docker compose --env-file .env.ci exec -T postgres psql -v ON_ERROR_STOP=1 -U bmc_automation -d bmc_portfolio -c "
            insert into vendors(vendor_id,business_name,public_email,public_phone,website,source_url,status,quality_score)
            values('v_ci_stage','CI Stage Vendor','ci-stage@example.com','9285550199','https://example.com/','https://example.com/','prospect',100);
            insert into vendor_markets(vendor_id,market) values('v_ci_stage','CI Stage Market');
            insert into vendor_services(vendor_id,service_key) values('v_ci_stage','commercial_cleaning');
            insert into outreach(entity_type,entity_id,campaign,wave,channel,sequence_step,status,next_followup_at,opt_out)
            values('vendor','v_ci_stage','vendor_recruitment','backlog','email',0,'queued',now(),false);"
          bash ./stage-outreach-wave.sh .env.ci vendor ci_launch 1 "CI Stage Market" commercial_cleaning preview >/tmp/bmc_stage_preview.txt
          grep -q 'restage:backlog' /tmp/bmc_stage_preview.txt
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='vendor' and entity_id='v_ci_stage' and wave='backlog' and status='queued' and sent_at is null;")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where wave='ci_launch';")" -eq 0
          bash ./stage-outreach-wave.sh .env.ci vendor ci_launch 1 "CI Stage Market" commercial_cleaning --apply >/tmp/bmc_stage_apply.txt
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='vendor' and entity_id='v_ci_stage' and campaign='vendor_recruitment' and wave='ci_launch' and status='queued' and sent_at is null and target_market='CI Stage Market' and target_service_key='commercial_cleaning';")" -eq 1
          curl -fsS 'http://127.0.0.1:8000/api/admin/outreach-wave-preview?side=vendor&wave=ci_launch&limit=10' \
            -H 'X-BMC-Admin-Key: ci_admin_key' >/tmp/bmc_wave_preview.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bmc_wave_preview.json"))
          assert data["ok"] is True
          assert data["sending_enabled"] is False
          assert data["count"] == 1
          row=data["records"][0]
          assert row["entity_id"] == "v_ci_stage"
          assert row["market"] == "CI Stage Market"
          assert row["service_key"] == "commercial_cleaning"
          assert "/provider-pilot-activate/?" in row["body"]
          assert "vendor_id=v_ci_stage" in row["body"]
          assert "activation_token=" in row["body"]
          PY

          # Execute the production launch audit against the disposable stack in report mode.
          # Public production checks may legitimately report blockers here; the purpose is to
          # prove all database/config queries execute without schema/SQL errors.
          bash ./launch-readiness.sh .env.ci report >/tmp/bmc_launch_readiness_ci.txt
          grep -q 'BMC launch readiness audit' /tmp/bmc_launch_readiness_ci.txt
          grep -q 'Vendor prospect pool' /tmp/bmc_launch_readiness_ci.txt
          grep -q 'Buyer prospect pool' /tmp/bmc_launch_readiness_ci.txt
          grep -q 'Audit summary:' /tmp/bmc_launch_readiness_ci.txt
          grep -q 'Deep market inventory coverage' /tmp/bmc_launch_readiness_ci.txt
          grep -q 'Public local-demand coverage' /tmp/bmc_launch_readiness_ci.txt
          bash ./production-proof-readout.sh .env.ci >/tmp/bmc_production_proof_ci.txt
          grep -q 'BMC PRODUCTION PROOF READOUT' /tmp/bmc_production_proof_ci.txt
          grep -q 'DEEP MARKET INVENTORY TOTALS' /tmp/bmc_production_proof_ci.txt
          grep -q 'PUBLIC LOCAL-DEMAND MONITOR COVERAGE' /tmp/bmc_production_proof_ci.txt
          grep -q 'STRICT LAUNCH AUDIT' /tmp/bmc_production_proof_ci.txt
          docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -c "
            delete from outreach where entity_type='vendor' and entity_id='v_ci_stage';
            delete from vendor_services where vendor_id='v_ci_stage';
            delete from vendor_markets where vendor_id='v_ci_stage';
            delete from vendors where vendor_id='v_ci_stage';"
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from information_schema.tables where table_name='public_opportunities';")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from information_schema.tables where table_name='local_demand_signals';")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from information_schema.tables where table_name='source_native_state';")" -eq 1
          for growth_table in growth_experiment_cells growth_outreach_targets growth_sample_requests growth_sample_prospects growth_order_prospects; do
            test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from information_schema.tables where table_name='$growth_table';")" -eq 1
          done
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='vendor' and wave='pilot1';")" -eq 12
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='buyer' and wave='pilot1';")" -eq 7
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='buyer' and campaign='growth_pack_sales' and wave='growth1';")" -ge 1
          bash runtime-doctor.sh .env.ci

          # Prove First Wave provider copy uses the dedicated existing-vendor activation path.
          export BMC_ADMIN_KEY="$(grep '^BMC_ADMIN_KEY=' .env.ci | cut -d= -f2-)"

          # CI_GROWTH_E2E_V1 — prove free sample -> reserve gate -> nurture -> paid fulfillment.
          docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -c "
            insert into market_inventory_candidates(
              side,market,category_key,category_label,business_name,source_url,source_domain,public_phone,
              official_site,source_tier,verification_status,last_verified_at,status,last_seen_at
            )
            select 'buyer','CI Growth Market','restaurants','Restaurants',
              'CI Commercial Prospect '||g,
              'https://ci-prospect-'||g||'.example.com','ci-prospect-'||g||'.example.com',
              '928555'||lpad(g::text,4,'0'),true,'direct','direct_evidence',now(),'discovered',now()
            from generate_series(1,135) g
            on conflict do nothing;

            insert into market_inventory_candidates(
              side,market,category_key,category_label,business_name,source_url,source_domain,public_email,public_phone,
              official_site,source_tier,verification_status,last_verified_at,status,last_seen_at
            ) values(
              'vendor','CI Growth Market','pressure_washing','Pressure Washing','CI Pressure Wash Co',
              'https://ci-pressure.example.com','ci-pressure.example.com','ci-pressure@example.com','9285559999',
              true,'direct','direct_evidence',now(),'discovered',now()
            ) on conflict do nothing;

            -- Only synthetic domains are marked redistribution-approved for this test.
            insert into growth_source_rights_review(source_domain,status,basis,reviewed_at)
            select 'ci-prospect-'||g||'.example.com','approved','synthetic CI test domain',now()
            from generate_series(1,135) g
            on conflict(source_domain) do update set status='approved',reviewed_at=now();"

          curl -fsS -X POST http://127.0.0.1:8000/api/admin/stage-growth-pressure-washing \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_growth_stage.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/bmc_growth_stage.json"))
          assert d["ok"] is True
          assert d["staged"] >= 1, d
          assert d["qualified_pool_by_market"]["CI Growth Market"] >= 125, d
          PY

          # Prove the cold-email CTA can reuse known target data instead of sending the prospect through the form again.
          export CI_GROWTH_TARGET="$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select target_id from growth_outreach_targets where public_email='ci-pressure@example.com' limit 1;")"
          test -n "$CI_GROWTH_TARGET"
          docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -c "
            update outreach set status='sent',sequence_step=1,sent_at=now()
            where entity_type='growth_customer' and entity_id='$CI_GROWTH_TARGET' and campaign='growth_sales';"
          export CI_GROWTH_CLAIM="$(python - <<'PY'
          import hashlib,hmac,os
          payload=f"{os.environ['CI_GROWTH_TARGET']}\nci-pressure@example.com".encode()
          print(hmac.new(os.environ["BMC_ADMIN_KEY"].encode(),payload,hashlib.sha256).hexdigest()[:40])
          PY
          )"
          # Owner preview must render the same five-target experience without mutating the prospect or creating a sample.
          curl -fsS -X POST http://127.0.0.1:8000/api/growth/claim-free-five \
            -H 'Content-Type: application/json' \
            -d '{"target_id":"'"$CI_GROWTH_TARGET"'","claim":"'"$CI_GROWTH_CLAIM"'","preview":"1","utm_source":"owner_preview"}' \
            >/tmp/bmc_growth_owner_preview.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/bmc_growth_owner_preview.json"))
          assert d["ok"] is True and d["status"] == "sample_ready", d
          assert d["preview"] is True, d
          assert d["sample_id"] == "owner-preview", d
          assert len(d["sample"]) == 5, d
          assert d["checkout_url"] == "#owner-preview-checkout", d
          PY
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from growth_sample_requests where source_target_id='$CI_GROWTH_TARGET';")" -eq 0
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='growth_customer' and entity_id='$CI_GROWTH_TARGET' and status='sent' and reply_type is null;")" -eq 1

          curl -fsS -X POST http://127.0.0.1:8000/api/growth/claim-free-five \
            -H 'Content-Type: application/json' \
            -d '{"target_id":"'"$CI_GROWTH_TARGET"'","claim":"'"$CI_GROWTH_CLAIM"'","utm_source":"ci_email"}' \
            >/tmp/bmc_growth_one_click.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/bmc_growth_one_click.json"))
          assert d["ok"] is True
          assert d["status"] == "sample_ready", d
          assert len(d["sample"]) == 5, d
          assert d["qualified_pool"] >= 125, d
          assert "buy.stripe.com" in d["checkout_url"], d
          PY
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from growth_sample_requests where source_target_id='$CI_GROWTH_TARGET' and submission_id like 'growth_claim_%';")" -eq 1
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from outreach where entity_type='growth_customer' and entity_id='$CI_GROWTH_TARGET' and reply_type='sample_requested';")" -eq 1
          # Restore the synthetic send marker so the existing outbound-safety invariant remains meaningful later in this job.
          docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -c "
            update outreach set status='queued',sequence_step=0,sent_at=null,next_followup_at=now()
            where entity_type='growth_customer' and entity_id='$CI_GROWTH_TARGET' and campaign='growth_sales';"

          curl -fsS -X POST http://127.0.0.1:8000/api/intake \
            -H 'Content-Type: application/json' \
            -d '{"submission_id":"ci-growth-sample-1","form_type":"growth_snapshot","service_key":"pressure_washing","business_name":"CI Pressure Wash Co","contact_name":"CI Owner","email":"ci-owner@example.com","market":"CI Growth Market","ideal_customer":"restaurants","minimum_job":"500","consent":"yes","source_target_id":"inventory:'"$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select candidate_id from market_inventory_candidates where side='vendor' and public_email='ci-pressure@example.com' limit 1;")"'"}' \
            >/tmp/bmc_growth_sample.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/bmc_growth_sample.json"))
          assert d["ok"] is True
          assert d["status"] == "sample_ready", d
          assert len(d["sample"]) == 5, d
          assert d["qualified_pool"] >= 125, d
          assert "buy.stripe.com" in d["checkout_url"], d
          assert "client_reference_id=growth_" in d["checkout_url"], d
          assert all(x["fit_score"] >= 65 for x in d["sample"]), d
          PY
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from growth_sample_prospects where sample_id=(select sample_id from growth_sample_requests where submission_id='ci-growth-sample-1');")" -eq 5

          # The one-click sample and second customer sample MUST contain ten distinct prospects.
          # This tests real cross-customer rotation, not merely a static symbol name.
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from growth_prospect_exposures where market='CI Growth Market' and delivery_kind='free' and status='delivered';")" -eq 10
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(distinct prospect_key) from growth_prospect_exposures where market='CI Growth Market' and delivery_kind='free' and status='delivered';")" -eq 10
          # Record objections and verify the suppression table can block exposure.
          docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -c "
            insert into growth_prospect_suppressions(prospect_key,reason,source)
            select prospect_key,'CI reported no contact','ci'
            from growth_prospect_exposures
            where market='CI Growth Market' order by exposure_id limit 1
            on conflict(prospect_key) do update set lifted_at=null,reason=excluded.reason;"
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from growth_prospect_suppressions where source='ci' and lifted_at is null;")" -eq 1

          # Force the first nurture reminder due and prove it advances without sending when not due again.
          docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -c "
            update growth_sample_requests set next_nurture_at=now()-interval '1 minute'
            where submission_id='ci-growth-sample-1';"
          curl -fsS -X POST http://127.0.0.1:8000/api/process-growth-nurture \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_growth_nurture_e2e.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/bmc_growth_nurture_e2e.json"))
          assert d["ok"] is True and d["sent"] == 1, d
          PY
          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select nurture_step from growth_sample_requests where submission_id='ci-growth-sample-1';")" -eq 1

          # Simulate a paid, already-linked order. The fulfillment endpoint must build exactly
          # 100 unique, in-market, score-passing rows and complete the order automatically.
          docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -c "
            with s as (select sample_id,email from growth_sample_requests where submission_id='ci-growth-sample-1'),
            o as (
              insert into orders(product_key,customer_email,amount_cents,currency,payment_status,status,growth_sample_id)
              select 'growth_pack_starter',email,49900,'usd','paid','ready_for_fulfillment',sample_id from s
              returning order_id,growth_sample_id
            )
            insert into tasks(order_id,service_key,task_type,status,priority,owner,summary,payload)
            select order_id,'growth_pack','fulfill_growth_pack','open','high','bmc_operator','CI Growth fulfillment',
              jsonb_build_object('growth_sample_id',growth_sample_id) from o;"
          curl -fsS -X POST http://127.0.0.1:8000/api/process-growth-fulfillment \
            -H "X-BMC-Admin-Key: $BMC_ADMIN_KEY" >/tmp/bmc_growth_fulfill_e2e.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/bmc_growth_fulfill_e2e.json"))
