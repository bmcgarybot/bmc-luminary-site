          test "$(docker compose --env-file .env.ci exec -T postgres psql -U bmc_automation -d bmc_portfolio -Atc "select count(*) from lead_matches where lead_id='$GROWTH_LEAD_ID'::uuid;")" -eq 0

          # Match the real live Payment Link shape: product is resolved from payment_link, not synthetic metadata.
          export PAYLOAD='{"id":"evt_ci_checkout_1","type":"checkout.session.completed","data":{"object":{"id":"cs_ci_1","mode":"payment","payment_status":"paid","amount_total":49900,"currency":"usd","payment_link":"plink_1UUYdjQU2BLM8GhLWdq2uB1F","customer_details":{"email":"ci-growth@example.com"}}}}'
