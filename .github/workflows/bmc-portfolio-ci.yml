          fi
      - name: Tear down smoke stack
        if: always()
        working-directory: portfolio/automation
        run: |
          docker rm -f research-mock 2>/dev/null || true
          if [ -f .env.ci ]; then
            docker compose --env-file .env.ci down -v || true
          fi
