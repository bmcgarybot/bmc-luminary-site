name: Assistant CMS Clinical Lab Census Export

on:
  push:
    paths:
      - 'portfolio/automation/export-cms-clinical-lab-census.py'
      - '.github/workflows/assistant-cms-clinical-lab-census.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export official CMS clinical laboratories for BMC markets
        run: |
          python3 portfolio/automation/export-cms-clinical-lab-census.py \
            --date 2026-10-26 \
            --output-dir portfolio/data

      - name: Validate deterministic census builder
        run: |
          python3 portfolio/automation/build-assistant-research-seed.py \
            --data-dir portfolio/data \
            --output /tmp/assistant-research-seed.sql \
            --summary-json 2>/tmp/census-summary.json
          cat /tmp/census-summary.json

      - name: Commit CMS clinical-lab government-registry artifact
        run: |
          git config user.name "BMC Assistant Census"
          git config user.email "actions@users.noreply.github.com"
          git add portfolio/data/assistant-research-bootstrap-2026-10-26-cms-clinical-labs-24.json
          if git diff --cached --quiet; then
            echo "No CMS clinical-lab artifact changes."
            exit 0
          fi
          git commit -m "Seed official CMS clinical lab census"
          git pull --rebase origin master
          git push origin HEAD:master
