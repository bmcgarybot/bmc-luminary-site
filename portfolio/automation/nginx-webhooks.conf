server {
  listen 8080;
  server_name _;
  server_tokens off;

  client_max_body_size 10m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control "no-store" always;

  location = /api/email-preferences {
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    # Signed recipient URLs must not appear in proxy access logs.
    access_log off;
    proxy_pass http://ops_api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Only signed UUID offer pages are public. Admin/review/worker routes stay private.
  location ~ "^/api/growth/offers/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
    if ($request_method != GET) { return 405; }
    access_log off;
    proxy_pass http://ops_api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /api/intake {
    if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }

    proxy_pass http://ops_api:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Public customer endpoint only; all private admin paths remain denied.
  location = /api/service-search {
    if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }

    proxy_pass http://ops_api:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Public customer endpoint only; all private admin paths remain denied.
  location = /api/growth/claim-free-five {
    if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }

    proxy_pass http://ops_api:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Signed customer request creates a draft only; never a payment or approval.
  location = /api/growth/request-small-pack {
    if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }

    proxy_pass http://ops_api:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Public customer endpoint only; all private admin paths remain denied.
  location = /api/growth/verify-email {
    if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }

    proxy_pass http://ops_api:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Exact Nevada public routes; never expose /api/admin/nevada/*.
  location = /api/nevada/status {
    if ($request_method !~ ^(GET|OPTIONS)$) { return 405; }
    proxy_pass http://ops_api:8000;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
  }

  location = /api/nevada/request {
    if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
    client_max_body_size 10k;
    proxy_pass http://ops_api:8000;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /api/stripe-webhook {
    if ($request_method != POST) { return 405; }

    proxy_pass http://ops_api:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ^~ /webhook/ {
    proxy_pass http://n8n:5678;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / { return 404; }
}
