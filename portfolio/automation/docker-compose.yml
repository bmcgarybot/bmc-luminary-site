services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - bmc_postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./seed-services.sql:/docker-entrypoint-initdb.d/010-seed-services.sql:ro
      - ./seed-vendors.sql:/docker-entrypoint-initdb.d/020-seed-vendors.sql:ro
      - ./seed-buyers.sql:/docker-entrypoint-initdb.d/030-seed-buyers.sql:ro
      - ./seed-outreach.sql:/docker-entrypoint-initdb.d/040-seed-outreach.sql:ro
      - ./seed-buyer-outreach.sql:/docker-entrypoint-initdb.d/050-seed-buyer-outreach.sql:ro
      - ./seed-first-wave.sql:/docker-entrypoint-initdb.d/055-seed-first-wave.sql:ro
      - ./seed-products.sql:/docker-entrypoint-initdb.d/060-seed-products.sql:ro
      - ./seed-research.sql:/docker-entrypoint-initdb.d/070-seed-research.sql:ro
    networks: [bmc_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ops_api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      BMC_ADMIN_KEY: ${BMC_ADMIN_KEY}
      OFFER_HOURS: ${OFFER_HOURS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      SMTP_DRY_RUN: ${SMTP_DRY_RUN}
      OUTREACH_ENABLED: ${OUTREACH_ENABLED}
      OUTREACH_DAILY_LIMIT: ${OUTREACH_DAILY_LIMIT}
      OUTREACH_WAVE: ${OUTREACH_WAVE}
      BUSINESS_POSTAL_ADDRESS: ${BUSINESS_POSTAL_ADDRESS}
      BUYER_OUTREACH_ENABLED: ${BUYER_OUTREACH_ENABLED}
      BUYER_OUTREACH_DAILY_LIMIT: ${BUYER_OUTREACH_DAILY_LIMIT}
      BUYER_OUTREACH_WAVE: ${BUYER_OUTREACH_WAVE}
      IMAP_ENABLED: ${IMAP_ENABLED}
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      IMAP_FOLDER: ${IMAP_FOLDER}
      LOCAL_AI_ENABLED: ${LOCAL_AI_ENABLED}
      LOCAL_AI_URL: ${LOCAL_AI_URL}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL}
      AGENT_ENABLED: ${AGENT_ENABLED}
      AGENT_MIN_CONFIDENCE: ${AGENT_MIN_CONFIDENCE}
      AGENT_CYCLE_LIMIT: ${AGENT_CYCLE_LIMIT}
      AGENT_RESEARCH_TASK_LIMIT: ${AGENT_RESEARCH_TASK_LIMIT}
      AGENT_ALLOW_EXTERNAL_ACTIONS: ${AGENT_ALLOW_EXTERNAL_ACTIONS}
      RESEARCH_SEARCH_ENABLED: ${RESEARCH_SEARCH_ENABLED}
      RESEARCH_SEARCH_URL: ${RESEARCH_SEARCH_URL}
      RESEARCH_SEARCH_RESULTS: ${RESEARCH_SEARCH_RESULTS}
      RESEARCH_WORKER_BATCH: ${RESEARCH_WORKER_BATCH}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "127.0.0.1:8000:8000"
    networks: [bmc_internal]


  scheduler:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on: [ops_api]
    environment:
      BMC_ADMIN_KEY: ${BMC_ADMIN_KEY}
    volumes:
      - ./scheduler.sh:/app/scheduler.sh:ro
    command: ["/bin/sh","/app/scheduler.sh"]
    networks: [bmc_internal]

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: America/Phoenix
      TZ: America/Phoenix
      WEBHOOK_URL: ${WEBHOOK_URL}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      LOCAL_AI_URL: ${LOCAL_AI_URL}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL}
      BMC_OPS_API: http://ops_api:8000
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - bmc_n8n:/home/node/.n8n
    networks: [bmc_internal]

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - bmc_searxng_cache:/var/cache/searxng
    ports:
      - "127.0.0.1:8888:8080"
    networks: [bmc_internal]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["local-ai"]
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - bmc_ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks: [bmc_internal]

  webhook_proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [ops_api,n8n]
    volumes:
      - ./nginx-webhooks.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [bmc_internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [webhook_proxy]
    networks: [bmc_internal]

networks:
  bmc_internal:

volumes:
  bmc_postgres:
  bmc_n8n:
  bmc_ollama:
  bmc_searxng_cache:
