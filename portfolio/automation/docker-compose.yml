x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - bmc_postgres:/var/lib/postgresql/data
    networks: [bmc_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ops_api:
    build: ./api
    restart: unless-stopped
    mem_limit: 768m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      BMC_ADMIN_KEY: ${BMC_ADMIN_KEY}
      OFFER_HOURS: ${OFFER_HOURS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      SMTP_DRY_RUN: ${SMTP_DRY_RUN}
      OUTREACH_ENABLED: ${OUTREACH_ENABLED}
      OUTREACH_DAILY_LIMIT: ${OUTREACH_DAILY_LIMIT}
      OUTREACH_WAVE: ${OUTREACH_WAVE}
      BUSINESS_POSTAL_ADDRESS: ${BUSINESS_POSTAL_ADDRESS}
      BUYER_OUTREACH_ENABLED: ${BUYER_OUTREACH_ENABLED}
      BUYER_OUTREACH_DAILY_LIMIT: ${BUYER_OUTREACH_DAILY_LIMIT}
      BUYER_OUTREACH_WAVE: ${BUYER_OUTREACH_WAVE}
      GROWTH_OUTREACH_ENABLED: ${GROWTH_OUTREACH_ENABLED:-false}
      GROWTH_OUTREACH_DAILY_LIMIT: ${GROWTH_OUTREACH_DAILY_LIMIT:-10}
      GROWTH_OUTREACH_WAVE: ${GROWTH_OUTREACH_WAVE:-growth1}
      IMAP_ENABLED: ${IMAP_ENABLED}
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      IMAP_FOLDER: ${IMAP_FOLDER}
      LOCAL_AI_ENABLED: ${LOCAL_AI_ENABLED}
      LOCAL_AI_URL: ${LOCAL_AI_URL}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL}
      AGENT_ENABLED: ${AGENT_ENABLED}
      AGENT_MIN_CONFIDENCE: ${AGENT_MIN_CONFIDENCE}
      AGENT_CYCLE_LIMIT: ${AGENT_CYCLE_LIMIT}
      AGENT_RESEARCH_TASK_LIMIT: ${AGENT_RESEARCH_TASK_LIMIT}
      AGENT_ALLOW_EXTERNAL_ACTIONS: ${AGENT_ALLOW_EXTERNAL_ACTIONS}
      RESEARCH_SEARCH_ENABLED: ${RESEARCH_SEARCH_ENABLED}
      RESEARCH_SEARCH_URL: ${RESEARCH_SEARCH_URL}
      RESEARCH_SEARCH_RESULTS: ${RESEARCH_SEARCH_RESULTS}
      RESEARCH_WORKER_BATCH: ${RESEARCH_WORKER_BATCH}
      RESEARCH_MAX_PASSES: ${RESEARCH_MAX_PASSES:-4}
      RESEARCH_AUTO_PROMOTE_CONTACTS: ${RESEARCH_AUTO_PROMOTE_CONTACTS:-true}
      SOURCE_NATIVE_RESEARCH_ENABLED: ${SOURCE_NATIVE_RESEARCH_ENABLED:-true}
      SOURCE_NATIVE_CHECK_BATCH: ${SOURCE_NATIVE_CHECK_BATCH:-10}
      SOURCE_NATIVE_MARKETS: ${SOURCE_NATIVE_MARKETS:-Prescott,Prescott Valley,Chino Valley,Dewey-Humboldt,Mayer,Cordes Lakes,Williamson Valley,Ash Fork,Seligman,Skull Valley,Camp Verde,Cottonwood,Sedona,Flagstaff,Winslow,Kingman,Golden Valley,Bullhead City,Phoenix,Scottsdale,Tucson}
      ADHS_FACILITIES_URL: ${ADHS_FACILITIES_URL:-https://services1.arcgis.com/mpVYz37anSdrK4d8/ArcGIS/rest/services/All_State_Licensed_Facilities_in_Arizona/FeatureServer/18/query}
      ADHS_SOURCE_NATIVE_PAGE_SIZE: ${ADHS_SOURCE_NATIVE_PAGE_SIZE:-100}
      CMS_SOURCE_NATIVE_ENABLED: ${CMS_SOURCE_NATIVE_ENABLED:-true}
      CMS_SOURCE_NATIVE_PAGE_SIZE: ${CMS_SOURCE_NATIVE_PAGE_SIZE:-100}
      CMS_HOSPITALS_URL: ${CMS_HOSPITALS_URL:-https://data.cms.gov/provider-data/api/1/datastore/query/xubh-q36u/0}
      CMS_NURSING_HOMES_URL: ${CMS_NURSING_HOMES_URL:-https://data.cms.gov/provider-data/api/1/datastore/query/4pq5-n9py/0}
      CMS_HOME_HEALTH_URL: ${CMS_HOME_HEALTH_URL:-https://data.cms.gov/provider-data/api/1/datastore/query/6jpm-sxkc/0}
      CMS_HOSPICE_URL: ${CMS_HOSPICE_URL:-https://data.cms.gov/provider-data/api/1/datastore/query/yc9t-dgbk/0}
      CMS_BULK_DOWNLOAD_ENABLED: ${CMS_BULK_DOWNLOAD_ENABLED:-true}
      CMS_METADATA_BASE: ${CMS_METADATA_BASE:-https://data.cms.gov/provider-data/api/1/metastore/schemas/dataset/items}
      CMS_BULK_CACHE_TTL_SECONDS: ${CMS_BULK_CACHE_TTL_SECONDS:-21600}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "127.0.0.1:8000:8000"
    networks: [bmc_internal]

  research_refresher:
    build:
      context: .
      dockerfile: research-refresher.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OUTREACH_ENABLED: ${OUTREACH_ENABLED}
      BUYER_OUTREACH_ENABLED: ${BUYER_OUTREACH_ENABLED}
      GROWTH_OUTREACH_ENABLED: ${GROWTH_OUTREACH_ENABLED:-false}
      RESEARCH_REFRESH_POLL_SECONDS: ${RESEARCH_REFRESH_POLL_SECONDS:-900}
      DIRECTORY_REFRESH_INTERVAL_SECONDS: ${DIRECTORY_REFRESH_INTERVAL_SECONDS:-86400}
      LICENSED_REFRESH_INTERVAL_SECONDS: ${LICENSED_REFRESH_INTERVAL_SECONDS:-604800}
    networks: [bmc_internal]

  scheduler:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    depends_on: [ops_api]
    environment:
      BMC_ADMIN_KEY: ${BMC_ADMIN_KEY}
    volumes:
      - ./scheduler.sh:/app/scheduler.sh:ro
    command: ["/bin/sh","/app/scheduler.sh"]
    networks: [bmc_internal]

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    mem_limit: 1536m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: America/Phoenix
      TZ: America/Phoenix
      WEBHOOK_URL: ${WEBHOOK_URL}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      LOCAL_AI_URL: ${LOCAL_AI_URL}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL}
      BMC_OPS_API: http://ops_api:8000
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - bmc_n8n:/home/node/.n8n
    networks: [bmc_internal]

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    mem_limit: 768m
    logging: *default-logging
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - bmc_searxng_cache:/var/cache/searxng
    ports:
      - "127.0.0.1:8888:8080"
    networks: [bmc_internal]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 2500m
    logging: *default-logging
    profiles: ["local-ai"]
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - bmc_ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks: [bmc_internal]

  webhook_proxy:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    depends_on: [ops_api,n8n]
    volumes:
      - ./nginx-webhooks.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [bmc_internal]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [webhook_proxy]
    networks: [bmc_internal]

networks:
  bmc_internal:

volumes:
  bmc_postgres:
  bmc_n8n:
  bmc_ollama:
  bmc_searxng_cache:
